name: Probe apply patch v4

on:
  push:
    branches: [probe-phpstan-cti-report]

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    continue-on-error: true
    steps:
      - name: Checkout probe branch
        uses: actions/checkout@v4
        with:
          ref: probe-phpstan-cti-report
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: phpstan:2.2.14
      - name: PHPStan before
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]" || true
          git config user.email "github-actions[bot]@users.noreply.github.com" || true
          git fetch origin fix-phpstan-journals-list || true
          git checkout -b fixwork origin/fix-phpstan-journals-list || true
          echo "=== PHPSTAN BEFORE ===" | tee result.txt || true
          phpstan analyse --level=9 --no-progress -a dev/build/phpstan/bootstrap_action.php --memory-limit=3G htdocs/accountancy/admin/journals_list.php > before.txt 2>&1 || true
          cat before.txt | tee -a result.txt || true
      - name: Apply patch
        continue-on-error: true
        run: |
          echo "" | base64 -d > patch.py
          python3 patch.py > patchout.txt 2>&1 || true
          cat patchout.txt | tee -a result.txt || true
      - name: Lint and PHPStan after
        continue-on-error: true
        run: |
          php -l htdocs/accountancy/admin/journals_list.php > lint.txt 2>&1 || true
          cat lint.txt | tee -a result.txt || true
          echo "=== PHPSTAN AFTER ===" | tee -a result.txt || true
          phpstan analyse --level=9 --no-progress -a dev/build/phpstan/bootstrap_action.php --memory-limit=3G htdocs/accountancy/admin/journals_list.php > after.txt 2>&1 || true
          cat after.txt | tee -a result.txt || true
      - name: Push fix if verified
        continue-on-error: true
        run: |
          if grep -q "patch applied" patchout.txt && grep -q "No errors" after.txt; then
            git add htdocs/accountancy/admin/journals_list.php
            git commit -m "QUAL Fix 2 PHPStan warnings in journals list page" || true
            git push origin fixwork:fix-phpstan-journals-list || true
            echo "FIX_PUSHED=yes" | tee -a result.txt || true
          else
            echo "FIX_PUSHED=no" | tee -a result.txt || true
          fi
      - name: Commit result to probe branch
        continue-on-error: true
        run: |
          git checkout probe-phpstan-cti-report || true
          git add result.txt || true
          git commit -m "[skip ci] Add patch result" || echo "nothing to commit"
          git pull --rebase || true
          git push || true
