---
# Check the title (label) of a PR starts with a valid keyword (Fix|Close|New|Perf|Doc|Qual|Sec)
# and make the CI fails, so the PR is refused, if this is not the case.
# Note: the keyword can be in upper or lower case (use upper case to see the PR into the ChangeLog)
# and must be followed by a space, a '#' or a ':' (for example: "Fix #456 Short description", "Fix: Short description", "New Short description").
# Draft PRs are skipped (they are not analyzed until they are ready for review).
name: Check PR title keyword

on:
  pull_request:
    types: [opened, edited, reopened, ready_for_review, synchronize]

permissions: {}

jobs:
  check-pr-title:
    name: Check PR title starts with a valid keyword
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          if [ "$PR_IS_DRAFT" = "true" ]; then
            echo "PR is a draft, title check skipped."
            exit 0
          fi

          if echo "$PR_TITLE" | grep -Eiq '^(Fix|Close|New|Perf|Doc|Qual|Sec)\b'; then
            echo "Title of PR is valid: '$PR_TITLE'"
            exit 0
          fi

          echo "::error::The title of the PR must start with one of the keywords (Fix|Close|New|Perf|Doc|Qual|Sec) followed by a space, a ':' (or a '#ID'). Current title: '$PR_TITLE'"
          exit 1
