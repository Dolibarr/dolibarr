name: Probe apply patch v3

on:
  push:
    branches: [probe-phpstan-cti-report]

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    continue-on-error: true
    steps:
      - name: Checkout probe branch
        uses: actions/checkout@v4
        with:
          ref: probe-phpstan-cti-report
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: phpstan:2.2.14
      - name: PHPStan before
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin fix-phpstan-journals-list
          git checkout -b fixwork origin/fix-phpstan-journals-list
          echo "=== PHPSTAN BEFORE ===" | tee result.txt
          phpstan analyse --level=9 --no-progress -a dev/build/phpstan/bootstrap_action.php --memory-limit=3G htdocs/accountancy/admin/journals_list.php > before.txt 2>&1 || true
          cat before.txt | tee -a result.txt
      - name: Apply patch
        continue-on-error: true
        run: |
          python3 - <<'PYEOF'
path = 'htdocs/accountancy/admin/journals_list.php'
data = open(path, 'rb').read()
lines = data.split(b'\n')
assert len(lines) > 620, 'file too short'
l532 = lines[531]
l553 = lines[552]
l619 = lines[618]
assert l532 == b'\t\t$sortable = 1;', repr(l532)
assert l553 == b'\t\tprint getTitleFieldOfList($valuetoshow, 0, $_SERVER["PHP_SELF"], ($sortable ? $fieldlist[$field] : \'\'), ($page ? \'page=\'.$page.\'&\' : \'\'), $param, "", $sortfield, $sortorder, $class.\' \');', repr(l553)
assert l619 == b'\t\t\t\tif (isset($obj->code) && $id != 10) {', repr(l619)
new553 = b'\t\tprint getTitleFieldOfList($valuetoshow, 0, $_SERVER["PHP_SELF"], $fieldlist[$field], ($page ? \'page=\'.$page.\'&\' : \'\'), $param, "", $sortfield, $sortorder, $class.\' \');'
new619 = b'\t\t\t\tif (isset($obj->code)) {'
lines[552] = new553
lines[618] = new619
del lines[531]
open(path, 'wb').write(b'\n'.join(lines))
print('patch applied')
PYEOF
          echo "python exit: $?" | tee -a result.txt
      - name: Lint and PHPStan after
        continue-on-error: true
        run: |
          php -l htdocs/accountancy/admin/journals_list.php > lint.txt 2>&1 || true
          cat lint.txt | tee -a result.txt
          echo "=== PHPSTAN AFTER ===" | tee -a result.txt
          phpstan analyse --level=9 --no-progress -a dev/build/phpstan/bootstrap_action.php --memory-limit=3G htdocs/accountancy/admin/journals_list.php > after.txt 2>&1 || true
          cat after.txt | tee -a result.txt
      - name: Push fix if verified
        continue-on-error: true
        run: |
          if grep -q "No errors" after.txt; then
            git add htdocs/accountancy/admin/journals_list.php
            git commit -m "QUAL Fix 2 PHPStan warnings in journals list page"
            git push origin fixwork:fix-phpstan-journals-list
            echo "FIX_PUSHED=yes" | tee -a result.txt
          else
            echo "FIX_PUSHED=no" | tee -a result.txt
          fi
      - name: Commit result to probe branch
        continue-on-error: true
        run: |
          git checkout probe-phpstan-cti-report || true
          git add result.txt || true
          git commit -m "[skip ci] Add patch result" || echo "nothing to commit"
          git pull --rebase || true
          git push || true
