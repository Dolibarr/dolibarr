name: tmp phpstan td dump

on:
  push:
    branches:
      - tmp-phpstan-td-dump

permissions:
  contents: write
  pull-requests: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: phpstan:2.2.14
          extensions: calendar, json, imagick, gd, zip, mbstring, intl, opcache, imap, mysql, pgsql, sqlite3, ldap, xml

      - name: Create fix branch from develop and apply fixes
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin develop --depth=1
          git checkout -b fix-phpstan-td FETCH_HEAD
          echo '' | base64 -d > fix_td.py
          python3 fix_td.py
          git add -u
          git commit -m "QUAL: Fix 2 PHPStan warnings of CTI technical debt (EOPHAN nowdoc, Propal atvar this)"
          git show --stat --oneline HEAD > td_diff.txt
          git diff HEAD~1 HEAD >> td_diff.txt
          git push origin fix-phpstan-td 2>&1 | tee td_push.txt

      - name: Verify with PHPStan level 9 no baseline on the 2 files
        run: |
          set +e
          awk '!/phpstan-baseline\.neon/ && !/^includes:/ { print }' phpstan.neon.dist > phpstan_apstats.neon
          phpstan --level=9 -v analyze --no-progress -a dev/build/phpstan/bootstrap_action.php --memory-limit 7G --error-format=github -c phpstan_apstats.neon htdocs/core/actions_massactions.inc.php htdocs/core/class/commonobject.class.php > td_verify.txt 2>&1
          echo "PHPSTAN_EXITCODE=$?" >> td_verify.txt
          true

      - name: Publish result on temp PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          {
            echo "FIX APPLY RESULT v4"
            echo ""
            echo '~~~ status'
            cat fix_status.txt
            echo '~~~ diff'
            cat td_diff.txt
            echo '~~~ push'
            cat td_push.txt
            echo '~~~ phpstan verify'
            cat td_verify.txt
            echo '~~~'
          } > td_comment.md
          gh pr comment 41399 --repo Dolibarr/dolibarr --body-file td_comment.md
          exit 0
