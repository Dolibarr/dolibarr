name: tmp phpstan td dump

on:
  push:
    branches:
      - tmp-phpstan-td-dump

permissions:
  contents: read
  pull-requests: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: phpstan:2.2.14
          extensions: calendar, json, imagick, gd, zip, mbstring, intl, opcache, imap, mysql, pgsql, sqlite3, ldap, xml

      - name: Verify fix branch with PHPStan level 9 no baseline
        continue-on-error: true
        run: |
          set +e
          git fetch origin fix-phpstan-td --depth=1
          git checkout FETCH_HEAD -- htdocs/core/actions_massactions.inc.php htdocs/core/class/commonobject.class.php
          awk '!/phpstan-baseline[.]neon/ && !/^includes:/ { print }' phpstan.neon.dist > phpstan_apstats.neon
          head -4 phpstan_apstats.neon
          phpstan --level=9 -v analyze --no-progress -a dev/build/phpstan/bootstrap_action.php --memory-limit 7G --error-format=github -c phpstan_apstats.neon htdocs/core/actions_massactions.inc.php htdocs/core/class/commonobject.class.php > td_verify.txt 2>&1
          echo "PHPSTAN_EXITCODE=$?" >> td_verify.txt
          true

      - name: Publish result on temp PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          {
            echo "FIX VERIFY RESULT v6"
            echo ""
            echo '~~~ phpstan verify on fix branch'
            cat td_verify.txt 2>/dev/null || echo "no verify"
            echo '~~~'
          } > td_comment.md
          gh pr comment 41399 --repo Dolibarr/dolibarr --body-file td_comment.md
          exit 0
