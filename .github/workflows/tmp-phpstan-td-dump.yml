name: tmp phpstan td dump

on:
  push:
    branches:
      - tmp-phpstan-td-dump

permissions:
  contents: write
  pull-requests: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Amend commit message on fix branch
        continue-on-error: true
        run: |
          set -x
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin fix-phpstan-td --depth=2
          git checkout fix-phpstan-td
          git commit --amend -m "QUAL: Fix 2 PHPStan warnings of CTI technical debt (EOPHAN, Propal var)" -m "No functional change. The unused EOPHAN nowdoc expression of the generate_doc massaction is turned into a comment so its @phan-var-force annotation stays readable by tools, and the @var Propal $this phpdoc of the propal case is removed as it is not a subtype of \$this(CommonObject) (the @phan-var-force string next to it remains)." -m "Generated by Vibe"
          git push origin fix-phpstan-td --force-with-lease 2>&1 | tee td_amend.txt
          git log -1 --pretty=full > td_log.txt

      - name: Publish result on temp PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          {
            echo "AMEND RESULT v7"
            echo ""
            echo '~~~ amend'
            cat td_amend.txt 2>/dev/null || echo "no amend"
            echo '~~~ log'
            cat td_log.txt 2>/dev/null || echo "no log"
            echo '~~~'
          } > td_comment.md
          gh pr comment 41399 --repo Dolibarr/dolibarr --body-file td_comment.md
          exit 0
