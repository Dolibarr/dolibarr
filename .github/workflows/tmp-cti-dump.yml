name: TMP dump CTI PHPStan debt

on:
  push:
    branches:
      - tmp-cti-phpstan-dump
    paths-ignore:
      - 'tmp-dump/phpstan_debt.txt'
      - 'tmp-dump/page.html'
      - 'tmp-dump/run.log'

permissions:
  contents: write
  actions: read

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get failed CI logs of PR 41522
        run: |
          set -e
          export GH_TOKEN=${GITHUB_TOKEN}
          export GH_REPO=Dolibarr/dolibarr
          gh run list --branch qual-phpstan-commonobject-varthis --limit 20 --json databaseId,name,conclusion,workflowName > tmp-dump/runs.json 2>&1 || true
          cat tmp-dump/runs.json
          for id in $(gh run list --branch qual-phpstan-commonobject-varthis --limit 20 --json databaseId,conclusion --jq '.[] | select(.conclusion=="failure") | .databaseId'); do
            gh run view $id --log-failed > tmp-dump/failed_${id}.log 2>&1 || echo "no log for $id" > tmp-dump/failed_${id}.log
          done
          ls -la tmp-dump
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit dump
        run: |
          git config user.name "dolibot" && git config user.email "dolibarr-bot@users.noreply.github.com"
          git add tmp-dump
          git commit -m "TMP: dump failed CI logs" || echo "nothing to commit"
          git push || echo "push failed"
