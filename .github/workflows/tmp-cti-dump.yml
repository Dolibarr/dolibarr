name: TMP dump CTI PHPStan debt

on:
  push:
    branches:
      - tmp-cti-phpstan-dump
    paths-ignore:
      - 'tmp-dump/phpstan_debt.txt'
      - 'tmp-dump/page.html'
      - 'tmp-dump/run.log'

permissions:
  contents: write
  actions: read

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get Travis CI build info
        run: |
          set -e
          curl -sS -H "Travis-API-Version: 3" -H "User-Agent: Mozilla/5.0" https://api.travis-ci.com/build/278963382 -o tmp-dump/travis_build.json
          cat tmp-dump/travis_build.json | head -c 2000
          for jobid in $(python3 -c "import json;d=json.load(open('tmp-dump/travis_build.json'));print(' '.join(str(j['id']) for j in d.get('jobs',[])))"); do
            echo "Job $jobid"
            curl -sS -H "Travis-API-Version: 3" -H "User-Agent: Mozilla/5.0" "https://api.travis-ci.com/job/$jobid" -o tmp-dump/travis_job_$jobid.json || true
            curl -sSL -H "User-Agent: Mozilla/5.0" "https://api.travis-ci.com/job/$jobid/log.txt" -o tmp-dump/travis_log_$jobid.txt || echo "log fetch failed" > tmp-dump/travis_log_$jobid.txt
          done
          ls -la tmp-dump
      - name: Commit dump
        run: |
          git config user.name "dolibot" && git config user.email "dolibarr-bot@users.noreply.github.com"
          git add tmp-dump
          git commit -m "TMP: dump travis logs" || echo "nothing to commit"
          git push || echo "push failed"
