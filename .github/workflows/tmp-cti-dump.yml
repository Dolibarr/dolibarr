name: TMP push phpstan fix branch

on:
  push:
    branches:
      - tmp-cti-phpstan-dump
    paths-ignore:
      - 'tmp-dump/phpstan_debt.txt'
      - 'tmp-dump/page.html'
      - 'tmp-dump/run.log'

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push fix branch
        run: |
          set -e
          git config --global user.name "eldy"
          git config --global user.email "eldy@destailleur.fr"
          git clone --quiet --depth 1 --branch develop https://github.com/Dolibarr/dolibarr.git repo
          cd repo
          python3 ${GITHUB_WORKSPACE}/tmp-dump/patch.py
          git diff --stat
          git add htdocs/core/class/commonobject.class.php
          git commit -q -m "QUAL: Fix 2 PHPStan warnings of CTI technical debt (supplier var this)" -m "No functional change. The @var CommandeFournisseur $this and @var FactureFournisseur $this phpdocs of the order_supplier and invoice_supplier cases of setMulticurrencyRate() are removed as they are not subtypes of $this(CommonObject) (the @phan-var-force strings next to them remain). Same fix as the one applied on the propal case." -m "Generated by Vibe"
          git log -1 --format='%H %s'
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/Dolibarr/dolibarr.git" HEAD:refs/heads/qual-phpstan-commonobject-varthis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
