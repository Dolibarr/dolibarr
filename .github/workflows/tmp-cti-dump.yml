name: TMP dump CTI PHPStan debt

on:
  push:
    branches:
      - tmp-cti-phpstan-dump
    paths-ignore:
      - 'tmp-dump/phpstan_debt.txt'
      - 'tmp-dump/page.html'
      - 'tmp-dump/run.log'

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dump
        run: |
          mkdir -p tmp-dump
          curl -sL --max-time 180 -A "Mozilla/5.0" https://cti.dolibarr.org/ -o tmp-dump/page.html || echo "curl failed" > tmp-dump/run.log
          python3 tmp-dump/extract.py > tmp-dump/run.log 2>&1 || true
          cat tmp-dump/run.log || true
          git config user.name "dolibot"
          git config user.email "dolibarr-bot@users.noreply.github.com"
          git add tmp-dump
          git commit -m "TMP: dump CTI PHPStan debt table" || echo "nothing to commit"
          git push || echo "push failed"
