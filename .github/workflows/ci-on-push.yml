name: "CI-PUSH"


on:
  push:
    # Executer only on push of the main repository, not on fork.
    branches:
      - develop
      - master
      - '=.0'
    paths-ignore:
      - '.agents/**'

jobs:
  pre-commit:
    uses: ./.github/workflows/pre-commit.yml
    secrets: inherit
    with:
      gh_event: ${{ github.event_name }}
  phan:
    uses: ./.github/workflows/phan.yml
    secrets: inherit
    needs: [pre-commit]
    with:
      gh_event: ${{ github.event_name }}
  phpstan:
    uses: ./.github/workflows/phpstan.yml
    secrets: inherit
    needs: [pre-commit]
    with:
      gh_event: ${{ github.event_name }}
  #windows-ci:
  #  if: github.ref == 'refs/heads/develop'  # Condition for branch "develop"
  #  needs: [pre-commit, phan, phpstan]
  #  secrets: inherit
  #  uses: ./.github/workflows/windows-ci.yml
  #  with:
  #    gh_event: ${{ github.event_name }}
  gh-travis:  # Runs travis script on github runner (not on travis)
    # Always run on the reference branches: the push stages of .travis.yml do
    # more than the pull_request one (php lint, phpcs) and pushes here are far
    # less frequent than pull request updates.
    # needs: [windows-ci]
    secrets: inherit
    needs: [pre-commit, phan, phpstan]
    uses: ./.github/workflows/gh-travis.yml
    with:
      gh_event: ${{ github.event_name }}
