name: "CI-PUSH"


on:
  push:
    # Executer only on push of the main repository, not on fork.
    branches:
      - develop
      - master
      - '=.0'
    paths-ignore:
      - '.agents/**'

jobs:
  pre-commit:
    uses: ./.github/workflows/pre-commit.yml
    secrets: inherit
    with:
      gh_event: ${{ github.event_name }}
  phan:
    uses: ./.github/workflows/phan.yml
    secrets: inherit
    needs: [pre-commit]
    with:
      gh_event: ${{ github.event_name }}
  phpstan:
    uses: ./.github/workflows/phpstan.yml
    secrets: inherit
    needs: [pre-commit]
    with:
      gh_event: ${{ github.event_name }}
