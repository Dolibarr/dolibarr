name: "CI-PUSH"


on:
  push:
    # Executer only on push of the main repository, not on fork.
    branches:
      - develop
      - master
      - '=.0'
    paths-ignore:
      - '.agents/**'

jobs:
  pre-commit:
    uses: ./.github/workflows/pre-commit.yml
    secrets: inherit
    with:
      gh_event: ${{ github.event_name }}
  phan:
    uses: ./.github/workflows/phan.yml
    secrets: inherit
    needs: [pre-commit]
    with:
      gh_event: ${{ github.event_name }}
  phpstan:
    uses: ./.github/workflows/phpstan.yml
    secrets: inherit
    needs: [pre-commit]
    with:
      gh_event: ${{ github.event_name }}
  #windows-ci:
  #  if: github.ref == 'refs/heads/develop'  # Condition for branch "develop"
  #  needs: [pre-commit, phan, phpstan]
  #  secrets: inherit
  #  uses: ./.github/workflows/windows-ci.yml
  #  with:
  #    gh_event: ${{ github.event_name }}
  # Runs the build of the .travis.yml emulated on a github runner (not on
  # travis), see travis-emulated.yml. It starts only when the pre-commit CI
  # has passed. Add phan, phpstan to the "needs" to also wait for them.
  travis-emulated:
    secrets: inherit
    needs: [pre-commit]
    uses: ./.github/workflows/travis-emulated.yml
    with:
      gh_event: ${{ github.event_name }}
