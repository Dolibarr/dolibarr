---
# Check the number of PR created by the same user during the current day (UTC) does not exceed
# the quota defined in the variable MAX_PR_PER_USER_PER_DAY (20).
# All the PR are counted, whatever their state (open, closed or merged), including the drafts.
# The quota is checked for the author of the PR but also for each author of the commits of the PR,
# so a PR opened by somebody else than the original author (for example a maintainer that pulls
# the branch of a contributor on github and creates the PR with its own login) is also checked
# against the quota of the original author of the commits.
# Commits with no GitHub account linked to the email of their author can not be attributed
# to a user, so they are ignored.
# The Dolibarr maintainers (the accounts listed in EXCLUDED_MAINTAINERS) are not counted,
# so they can pull the branch of a contributor and create the PR with their own login,
# or add merge or fix commits on the PR of a contributor, without being blocked by this control.
# If the quota is exceeded, the CI fails, so the PR is refused.
# The PR can be closed and reopened the next day (the quota is reset at midnight UTC)
# to run the check again and pass it.
# Note: the GitHub search API used to count the PR has an indexing delay of 1 or 2 minutes,
# so a burst of PR opened at the same time may not be all detected by this control.
name: Check PR quota per user

on:
  pull_request:
    types: [opened, reopened]

permissions:
  pull-requests: read

jobs:
  check-pr-quota:
    name: Check PR quota per user
    runs-on: ubuntu-latest
    env:
      MAX_PR_PER_USER_PER_DAY: 20
      EXCLUDED_MAINTAINERS: '^(eldy|rycks|lvessiller-opendsi)$'
    steps:
      - name: Check the number of PR created by the author of the PR and by the authors of its commits during the current day (UTC)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)

          echo "Date of the check (UTC): ${TODAY}"
          echo "Author of the PR #${PR_NUMBER}: ${PR_AUTHOR}"

          # Get the authors of the commits of the PR (the GitHub accounts linked to the emails
          # of the commit authors), so the quota of the original author of the commits is also
          # checked even if the PR was opened by somebody else (for example a maintainer).
          # Merge commits added on the PR branch by a maintainer are also counted, but a
          # maintainer has no reason to exceed the quota so it changes nothing.
          COMMIT_AUTHORS=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/commits" --paginate \
            -q '.[].author.login | select(. != null)' | sort -u)

          # The quota is checked for the author of the PR and for each author of its commits,
          # except the Dolibarr maintainers who are excluded from the quota.
          USERS_TO_CHECK=$(printf '%s\n' "${PR_AUTHOR}" "${COMMIT_AUTHORS}" | sed '/^$/d' | sort -u \
            | grep -Ev "${EXCLUDED_MAINTAINERS}" || true)
          echo "Users the quota is checked for: $(echo "${USERS_TO_CHECK}" | tr '\n' ' ')"
          echo "Maximum number of PR allowed per user and per day: ${MAX_PR_PER_USER_PER_DAY}"

          FAILED=0
          while IFS= read -r USER_TO_CHECK; do
            # If everybody is a maintainer, there is no user left to check.
            if [ -z "${USER_TO_CHECK}" ]; then
              continue
            fi

            # Get the PR created by the user during the current day (UTC),
            # using the GitHub search API so no git history is needed (no checkout).
            # The PR being checked may or may not be already indexed by the search engine,
            # so it is excluded from the result to count only the other PR of the user.
            SEARCH_RESULT=$(gh api --method GET search/issues \
              -f q="repo:${REPO} is:pr author:${USER_TO_CHECK} created:>=${TODAY}" \
              -f per_page=100)

            NB_PR_TODAY=$(echo "${SEARCH_RESULT}" | jq --argjson pr "${PR_NUMBER}" \
              '[.items[].number | select(. != $pr)] | length')

            echo "Number of PR created today (UTC) by ${USER_TO_CHECK}, except this one: ${NB_PR_TODAY}"

            if [ "${NB_PR_TODAY}" -ge "${MAX_PR_PER_USER_PER_DAY}" ]; then
              echo "::error::The user ${USER_TO_CHECK} has already created ${NB_PR_TODAY} pull requests today (UTC) and the limit is ${MAX_PR_PER_USER_PER_DAY} pull requests per user and per day. This pull request is refused and will be automatically deleted after a delay if no repushed. Please wait for the next day (UTC) before creating new pull requests and close this pull request and reopen it the next day to run the check again."
              FAILED=1
            fi
          done <<< "${USERS_TO_CHECK}"

          if [ "${FAILED}" -ne 0 ]; then
            exit 1
          fi

          echo "The number of PR created today (UTC) by the author of this PR and by the authors of its commits is lower than the limit of ${MAX_PR_PER_USER_PER_DAY} PR per user and per day. OK."
