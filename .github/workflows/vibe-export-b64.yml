name: Vibe export files b64

on:
  push:
    branches: [tmp-vibe-phpstan-report]
    paths: ['.github/workflows/vibe-export-b64.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp-vibe-phpstan-report

      - name: Download and encode
        run: |
          curl -sL https://raw.githubusercontent.com/Dolibarr/dolibarr/develop/htdocs/compta/sociales/payments.php -o payments.php.work
          curl -sL https://raw.githubusercontent.com/Dolibarr/dolibarr/develop/htdocs/compta/facture/class/facture.class.php -o facture.class.php.work
          curl -sL https://raw.githubusercontent.com/Dolibarr/dolibarr/develop/htdocs/core/lib/functions.lib.php -o functions.lib.php.work
          git hash-object payments.php.work facture.class.php.work functions.lib.php.work
          base64 -w 76 payments.php.work > vibe-payments.php.b64
          base64 -w 76 facture.class.php.work > vibe-facture.class.php.b64
          base64 -w 76 functions.lib.php.work > vibe-functions.lib.php.b64

      - name: Commit b64 files
        run: |
          git config user.name "dolibarr-bot"
          git config user.email "dolibarr-bot@users.noreply.github.com"
          git add vibe-payments.php.b64 vibe-facture.class.php.b64 vibe-functions.lib.php.b64
          git commit -m "Export target files as base64" || echo "nothing to commit"
          git push
