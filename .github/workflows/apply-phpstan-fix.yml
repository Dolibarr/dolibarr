name: Apply PHPStan fix on accounting files page

on:
  push:
    branches: [fix-phpstan-accounting-files]

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: phpstan:2.2.14
          extensions: calendar, json, imagick, gd, zip, mbstring, intl, opcache, imap, mysql, pgsql, sqlite3, ldap, xml
      - name: Run phpstan before fix
        run: phpstan analyse --no-progress --memory-limit=2G -a dev/build/phpstan/bootstrap_action.php htdocs/compta/accounting-files.php > before.txt 2>&1 || true
      - name: Apply fix
        run: php apply-fix.php
      - name: Run phpstan after fix
        run: phpstan analyse --no-progress --memory-limit=2G -a dev/build/phpstan/bootstrap_action.php htdocs/compta/accounting-files.php > after.txt 2>&1 || true
      - name: Show phpstan results
        run: |
          echo "===== BEFORE ====="; cat before.txt; echo "===== AFTER ====="; cat after.txt
          if grep -q "No errors" after.txt; then echo "FIX VERIFIED"; else echo "Errors remain after fix"; exit 1; fi
      - name: Commit and push fix
        run: |
          rm -f apply-fix.php .github/workflows/apply-phpstan-fix.yml before.txt after.txt
          git config user.name "eldy"
          git config user.email "eldy@destailleur.fr"
          git add -A
          git commit -m "QUAL: Fix 2 PHPStan warnings in accounting files page" -m "The /** @var */ PHPDoc block of the \\$filesarray variable was separated from its assignment by the '@phan-var-force' declaration line, so phpstan did not apply the type annotation and the template type of dol_sort_array() could not be resolved. Reorder the two lines so the PHPDoc block is applied to the \\$filesarray assignment. This fixes the 2 warnings on htdocs/compta/accounting-files.php line 767 reported on https://cti.dolibarr.org/" -m "Generated by Vibe"
          git push
