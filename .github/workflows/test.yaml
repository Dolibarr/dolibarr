on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened]
    branches:
      - "18.0"

permissions:
  actions: read
  attestations: read
  checks: read
  contents: read
  deployments: read
  id-token: write
  issues: write
  discussions: write
  packages: read
  pages: read
  pull-requests: write
  repository-projects: write
  security-events: read
  statuses: read
  
jobs:
  demo_app_authentication:
    runs-on: ubuntu-latest
    steps:
      - name: Log
        run: echo "CIAPPID ${{ vars.CIAPPID }}"

      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CIAPPID }}
          private-key: ${{ secrets.CIAPPPRIKEY }}

      - name: Use the token
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          gh api dolibarr
