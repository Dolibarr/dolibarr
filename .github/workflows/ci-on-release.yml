name: "CI-RELEASE"

on:
  release:
    types: [published]

jobs:
  trigger-docker:
    uses: peter-evans/repository-dispatch@v4
    with:
      token: ${{ secrets.WORKFLOW_TOKEN }}
      repository: Dolibarr/dolibarr-docker
      event-type: new-release
      client-payload: '{"version": "${{ github.event.release.tag_name }}"}'
