name: "Close old PRs with draft status"

on:
  schedule:
    - cron: "0 21 * * 4"

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  close-old-draft-prs:
    runs-on: ubuntu-latest

    steps:
      - name: Find and close old draft PRs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          FOUR_MONTHS_AGO=$(date -d "4 months ago" --iso-8601=seconds)

          echo "Looking for open draft PRs not updated since: $FOUR_MONTHS_AGO"

          CLOSED_COUNT=0
          MAX_CLOSED=20

          gh pr list \
            --repo "$REPO" \
            --state open \
            --draft \
            --limit 1000 \
            --json number,title,createdAt,updatedAt,isDraft |
          jq -c '.[] | select(.isDraft == true and .updatedAt < "'"$FOUR_MONTHS_AGO"'")' |
          while IFS= read -r PR; do

            PR_NUMBER=$(echo "$PR" | jq -r '.number')
            PR_TITLE=$(echo "$PR" | jq -r '.title')
            CREATED_AT=$(echo "$PR" | jq -r '.createdAt')
            UPDATED_AT=$(echo "$PR" | jq -r '.updatedAt')

            echo ""
            echo "========================================"
            echo "PR #$PR_NUMBER: $PR_TITLE"
            echo "Created:      $CREATED_AT"
            echo "Last updated: $UPDATED_AT"
            echo "========================================"

            COMMENT="This draft PR has been closed automatically because it has not been updated for more than 4 months. If you are still working on it, feel free to reopen it (or submit a new PR) once it is ready."

            echo "Closing PR #$PR_NUMBER"

            gh pr close "$PR_NUMBER" \
              --repo "$REPO" \
              --comment "$COMMENT"

            CLOSED_COUNT=$((CLOSED_COUNT + 1))

            echo "Closed PRs: $CLOSED_COUNT/$MAX_CLOSED"

            if [ "$CLOSED_COUNT" -ge "$MAX_CLOSED" ]; then
              echo "Reached the maximum number of PRs to close. Stopping."
              break
            fi

          done
