name: TMP dump dict chunks
on:
  push:
    branches:
      - qual_phpstan_dict_sql_null
permissions:
  contents: write
jobs:
  dump:
    if: ${{ !startsWith(github.event.head_commit.message, 'TMPDUMP') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - name: Split
        run: |
          rm -rf .tmpdump && mkdir -p .tmpdump
          split -b 20000 htdocs/admin/dict.php .tmpdump/dict.part.
          for f in .tmpdump/dict.part.??; do base64 -w 0 "$f" | tr -d '\n' > "$f.b64"; rm -f "$f"; done
          ls -la .tmpdump
      - name: Commit dump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .tmpdump
          git commit -m "TMPDUMP dict.php chunks b64"
          git push
