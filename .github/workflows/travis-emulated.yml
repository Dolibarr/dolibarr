      # Port of the script section
      - name: Show some debug info, like table content, or migration log from some versions
        if: steps.init.outputs.run_build == 'yes'
        run: |
          set +e
          echo "===== $(date) Show some debug info, like table content, or migration log from some versions"
          echo '\d llx_blockedlog' | psql 'postgresql://postgres:postgres@127.0.0.1:5432/travis'
          cat $TRAVIS_BUILD_DIR/upgrade500600.log
          cat $TRAVIS_BUILD_DIR/upgrade19002000.log
          echo "===== $(date) end ====="

      # Port of the script section
      - name: Result of migration scripts
        if: steps.init.outputs.run_build == 'yes'
        run: |
          set +e
          echo "===== $(date) Result of migration scripts"
          ls -alrt $TRAVIS_BUILD_DIR/
          echo Show content of last file
          cat $TRAVIS_BUILD_DIR/"$(ls -rt $TRAVIS_BUILD_DIR/ | tail -n1)" || true
          echo "===== $(date) end ====="

      # Port of the script section
      - name: Enabling new modules
        if: steps.init.outputs.run_build == 'yes'
        run: |
          set -o pipefail
          echo "===== $(date) Enabling new modules"
          # Enable modules not enabled into original dump
          set -e
          cd "$TRAVIS_BUILD_DIR/htdocs/install"
          php upgrade2.php 0.0.0 0.0.0 MAIN_MODULE_API,MAIN_MODULE_ProductBatch,MAIN_MODULE_SupplierProposal,MAIN_MODULE_STRIPE,MAIN_MODULE_ExpenseReport > $TRAVIS_BUILD_DIR/enablemodule.log
          php upgrade2.php 0.0.0 0.0.0 MAIN_MODULE_WEBSITE,MAIN_MODULE_TICKET,MAIN_MODULE_ACCOUNTING,MAIN_MODULE_MRP >> $TRAVIS_BUILD_DIR/enablemodule.log
          php upgrade2.php 0.0.0 0.0.0 MAIN_MODULE_RECEPTION,MAIN_MODULE_RECRUITMENT >> $TRAVIS_BUILD_DIR/enablemodule.log
          php upgrade2.php 0.0.0 0.0.0 MAIN_MODULE_KnowledgeManagement,MAIN_MODULE_EventOrganization,MAIN_MODULE_PARTNERSHIP >> $TRAVIS_BUILD_DIR/enablemodule.log
          php upgrade2.php 0.0.0 0.0.0 MAIN_MODULE_EmailCollector >> $TRAVIS_BUILD_DIR/enablemodule.log
          php upgrade2.php 0.0.0 0.0.0 MAIN_MODULE_BlockedLog >> $TRAVIS_BUILD_DIR/enablemodule.log
          echo $?
          cat $TRAVIS_BUILD_DIR/enablemodule.log
          echo "===== $(date) end ====="

      # Port of the script section: the phpunit output is teed into a file
      # because a github runner has no tty, and provided as an artifact
      - name: Unit testing
        if: steps.init.outputs.run_build == 'yes'
        run: |
          set +e
          echo "===== $(date) Unit testing"
          # Execute phpunit, check its exit status and that the phpunit output shows a test summary
          if [ "x$TRAVIS_RUN_PHPUNIT_SOURCE_SCAN" = "xyes" ]; then
            phpunit -d memory_limit=-1 -c test/phpunit/phpunittest.xml test/phpunit/AllTests.php | tee $TRAVIS_BUILD_DIR/phpunit_output.log | grep -qE "(OK .*[0-9]+ tests.*[0-9]+ assertions|Tests: [0-9]+)"
          else
            PHPUNIT_DISABLE_SOURCE_SCAN=1 phpunit -d memory_limit=-1 -c test/phpunit/phpunittest.xml test/phpunit/AllTests.php | tee $TRAVIS_BUILD_DIR/phpunit_output.log | grep -qE "(OK .*[0-9]+ tests.*[0-9]+ assertions|Tests: [0-9]+)"
          fi
          phpunitresult=$((PIPESTATUS[0]?PIPESTATUS[0]:PIPESTATUS[2]))
          echo "Phpunit return code = $phpunitresult"
          echo "Content of end of apache error.log"
          sudo tail -n 200 /var/log/apache2/travis_error_log || true
          echo "===== $(date) end ====="
          # Comment next line if you want to go to the end to see the dolibarr.log file.
          [ $phpunitresult == 0 ] || exit $phpunitresult

      # Port of the after_script and after_failure sections
      - name: Show last lines of log files
        if: ${{ steps.init.outputs.run_build == 'yes' && ! cancelled() }}
        run: |
          set +e
          echo "===== $(date) Output last lines of dolibarr.log"
          ls $TRAVIS_BUILD_DIR/documents
          tail -n 50 $TRAVIS_BUILD_DIR/documents/dolibarr.log
          echo "Output last lines of apache error.log"
          sudo ls /var/log/apache2
          sudo tail -n 200 /var/log/apache2/travis_error_log
          echo "Output last lines of mysql error.log"
          sudo tail -n 200 /var/log/mysql/error.log
          echo "===== $(date) end ====="

      # Upload result log files of the build into the Artifact shared store
      - name: Provide log files as artifacts
        if: ${{ steps.init.outputs.run_build == 'yes' && ! cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: travis-emulated-logs
          path: |
            upgrade*.log
            enablemodule.log
            phpunit_output.log
            documents/dolibarr.log
