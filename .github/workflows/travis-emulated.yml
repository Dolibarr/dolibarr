---
# This workflow emulates on a github runner the build described into the
# .travis.yml file (webserver install, database upgrade from the 3.5.0 dump and
# phpunit tests), so the parent workflows ci-on-push.yml and ci-on-pull.yml can
# chain it after the pre-commit CI with a "needs" (a travis build can not be
# chained to a github workflow). Keep the shell blocks in sync with the
# sections of .travis.yml while both builds run in parallel: they are ports of
# its before_install/install/before_script/script sections, with the variables
# of its job matrix (TRAVIS_BUILD_DIR, DB, TRAVIS_PHP_VERSION, ...) emulated
# by the first step, and with the adaptations needed by a github runner
# commented inline.
name: "Travis-emulated"


# Controls when the workflow will run
on:
  # workflow called by the parent workflow ci-on-push.yml or ci-on-pull.yml
  workflow_call:
    inputs:
      gh_event:
        required: true
        type: string
  # can run job manually
  workflow_dispatch:
    inputs:
      gh_event:
        description: Event to emulate (push, pull_request or cron)
        required: false
        default: push
        type: string

concurrency:
  group: travis-emulated-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  gh_event: ${{ inputs.gh_event || github.event_name }}

jobs:
  travis-emulated:
    # jammy, like the dist of .travis.yml
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      # Emulation of the variables of the travis runner used by the shell blocks ported from .travis.yml
      TRAVIS_BUILD_DIR: ${{ github.workspace }}
      DEBUG: 'true'
    steps:
      # Checkout git sources to build (git depth 1, like the git section of .travis.yml)
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Port of the jobs section of .travis.yml: select the job of its matrix
      # that matches this event (at most one runs on travis: a push without
      # "latest php" in the commit message on a branch develop* or [0-9]* is
      # PHP 7.2 with PostgreSQL, a push with "latest php" or a cron uses the
      # latest PHP with MySQL, a pull request is PHP 8.5 with MySQL, phpcs and
      # the phpunit source scan) and set its variables. For a pull request, it
      # also ports the first before_install block: check with
      # dev/build/ci/build_required.sh if a changed file can change the result
      # of the build.
      - name: Init - Select the job of the travis matrix and check if the build is required
        id: init
        run: |
          set -o pipefail
          echo "===== $(date) Select the job of the travis matrix"
          commit_message=$(git log -1 --pretty=%B)
          TRAVIS_PULL_REQUEST=$(jq -r '.pull_request.number // "false"' "$GITHUB_EVENT_PATH")
          echo "Event = $gh_event, branch = $GITHUB_REF_NAME, pull request = $TRAVIS_PULL_REQUEST"
          echo "Commit message = $commit_message"
          TRAVIS_RUN_PARALLELLINT=no

          if [ "$gh_event" = 'pull_request' ]; then
            # The stage "Test on pull_request" of .travis.yml
            TRAVIS_TYPE=pull_request
            TRAVIS_PHP_VERSION=8.5
            PHP_APT_VERSION=8.5
            DB=mysql
            TRAVIS_RUN_PHPCS=yes
            TRAVIS_RUN_PHPUNIT_SOURCE_SCAN=yes
          elif [ "$gh_event" = 'cron' ] || echo "$commit_message" | grep -q 'latest php'; then
            # The stage "Test latest PHP on push or cron" of .travis.yml
            TRAVIS_TYPE=push
            TRAVIS_PHP_VERSION=latest
            PHP_APT_VERSION=8.5
            DB=mysql
            TRAVIS_RUN_PHPCS=no
            TRAVIS_RUN_PHPUNIT_SOURCE_SCAN=no
          elif { [ "$gh_event" = 'push' ] || [ "$gh_event" = 'workflow_dispatch' ]; } && [[ "$GITHUB_REF_NAME" =~ ^(develop|[0-9]) ]]; then
            # The stage "Test on push" of .travis.yml (branches develop* or [0-9]*)
            TRAVIS_TYPE=push
            TRAVIS_PHP_VERSION=7.2
            PHP_APT_VERSION=7.2
            DB=postgresql
            TRAVIS_RUN_PHPCS=no
            TRAVIS_RUN_PHPUNIT_SOURCE_SCAN=no
          else
            # Like .travis.yml, no job of its matrix matches this event: for
            # example a push on another branch (master) does not run the travis
            # build, we stop here like a travis_terminate 0.
            echo "No job of the travis matrix matches this event, we stop here"
            TRAVIS_PULL_REQUEST=false
            run_build=no
          fi

          echo "===== $(date) Check if the build is required (only for a pull request, we always build on push)"
          changed_files=''
          run_build=${run_build:-yes}
          if [ "$TRAVIS_PULL_REQUEST" != "false" ] && [ -n "$TRAVIS_PULL_REQUEST" ]; then
            if jq -r '.pull_request.labels[].name' "$GITHUB_EVENT_PATH" 2>/dev/null | grep -q '^ci: full$'; then
              echo "The build is forced by the label 'ci: full'"
            else
              # The clone is shallow (see fetch-depth), so we ask for the parents of the merge
              # commit of the pull request to know the list of files it changes.
              git fetch -q --depth=2 origin "+refs/pull/$TRAVIS_PULL_REQUEST/merge" 2>/dev/null || true
              changed_files=$(git diff --name-only FETCH_HEAD^1 FETCH_HEAD 2>/dev/null || true)
              if [ -z "$changed_files" ]; then
                echo "Can not get the list of changed files of pull request $TRAVIS_PULL_REQUEST, we run the build"
              elif printf '%s\n' "$changed_files" | bash dev/build/ci/build_required.sh; then
                echo "The build is required"
              else
                echo "No changed file of pull request $TRAVIS_PULL_REQUEST can change the result of the build, we stop here"
                run_build=no
              fi
            fi
          fi

          echo "DB=$DB" >> "$GITHUB_ENV"
          echo "TRAVIS_PULL_REQUEST=$TRAVIS_PULL_REQUEST" >> "$GITHUB_ENV"
          echo "TRAVIS_TYPE=$TRAVIS_TYPE" >> "$GITHUB_ENV"
          echo "TRAVIS_PHP_VERSION=$TRAVIS_PHP_VERSION" >> "$GITHUB_ENV"
          echo "PHP_APT_VERSION=$PHP_APT_VERSION" >> "$GITHUB_ENV"
          echo "TRAVIS_RUN_PARALLELLINT=$TRAVIS_RUN_PARALLELLINT" >> "$GITHUB_ENV"
          echo "TRAVIS_RUN_PHPCS=$TRAVIS_RUN_PHPCS" >> "$GITHUB_ENV"
          echo "TRAVIS_RUN_PHPUNIT_SOURCE_SCAN=$TRAVIS_RUN_PHPUNIT_SOURCE_SCAN" >> "$GITHUB_ENV"
          if [ -n "$changed_files" ]; then
            {
              echo "changed_files<<EOT"
              echo "$changed_files"
              echo "EOT"
            } >> "$GITHUB_ENV"
          fi
          echo "run_build=$run_build" >> "$GITHUB_OUTPUT"

      # Port of the before_install section: install the packages for PHP,
      # Apache and the databases. .travis.yml gets mariadb 10.6 from its
      # "addons" and memcached from its "services", the github runner has
      # mysql 8.0 preinstalled: stop it and remove its data directory so
      # mariadb is installed in its place (jammy provides the same 10.6).
      - name: Install repository and packages for PHP, Apache, MariaDB
        if: steps.init.outputs.run_build == 'yes'
        run: |
          set -o pipefail
          echo "===== $(date) Install repository of packages for PHP"
          sudo add-apt-repository -y ppa:ondrej/php
          sudo apt-get update

          echo "===== $(date) Install mariadb 10.6 (the addons of .travis.yml)"
          sudo systemctl stop mysql || true
          sudo rm -fr /var/lib/mysql
          sudo apt-get install -y mariadb-server

          echo "===== $(date) Install memcached (the services of .travis.yml)"
          sudo apt-get install -y memcached

          echo "===== $(date) Install packages for PHP $PHP_APT_VERSION"
          if [ "$DB" = 'postgresql' ]; then
            sudo apt-get install -y pgloader
          fi
          sudo apt-get install -y unzip apache2 php$PHP_APT_VERSION php$PHP_APT_VERSION-cli php$PHP_APT_VERSION-curl php$PHP_APT_VERSION-mysql php$PHP_APT_VERSION-pgsql php$PHP_APT_VERSION-gd php$PHP_APT_VERSION-imap php$PHP_APT_VERSION-intl php$PHP_APT_VERSION-ldap php$PHP_APT_VERSION-xml php$PHP_APT_VERSION-mbstring php$PHP_APT_VERSION-zip php$PHP_APT_VERSION-tidy libapache2-mod-php$PHP_APT_VERSION
          echo "===== $(date) end ====="

      # Port of the install section
      - name: Select the PHP version and install tools (phpunit, phpcs)
        if: steps.init.outputs.run_build == 'yes'
        run: |
          set -o pipefail
          echo "===== $(date) Run update-alternatives to set the correct PHP version"
          sudo update-alternatives --set php /usr/bin/php$PHP_APT_VERSION
          php -v | head -2

          echo "===== $(date) Updating Composer config"
          # Like .travis.yml but without sudo, so the global config is the one of the runner user
          composer -n config -g vendor-dir htdocs/includes
          composer -n config -g audit.block-insecure false

          echo "===== $(date) Update Composer version and Install tools - PHP Unit, PHP CodeSniffer - for $TRAVIS_PHP_VERSION"
          echo "(a composer version 2.5 is bugged and generates phpunit error Exception: Serialization of 'Closure' is not allowed)"
          if [ "$TRAVIS_PHP_VERSION" = '7.2' ]; then
            sudo composer self-update 2.2.18
            composer -n require phpunit/phpunit ^7.5
          else
            sudo composer self-update 2.4.4
            composer -n require --ignore-platform-reqs phpunit/phpunit ^8
          fi
          if [ "x$TRAVIS_RUN_PHPCS" = "xyes" ]; then
            composer -n require --ignore-platform-reqs squizlabs/php_codesniffer ^3
          fi
          if [ "x$TRAVIS_RUN_PARALLELLINT" = "xyes" ]; then
            composer -n require --ignore-platform-reqs php-parallel-lint/php-parallel-lint ^1.2 php-parallel-lint/php-console-highlighter ^0
          fi

          # Remove non expected files
          rm -fr "$TRAVIS_BUILD_DIR/htdocs/includes/phpunit/php-code-coverage/src/Report/Html/Renderer/Template/js"

          echo "===== $(date) Adding path of binaries tools installed by composer to the PATH"
          echo "$TRAVIS_BUILD_DIR/htdocs/includes/bin" >> "$GITHUB_PATH"
          ls "$TRAVIS_BUILD_DIR/htdocs/includes/bin"
          echo "===== $(date) end ====="

      # Port of the before_script section (information only)
      - name: Show versions of tools
        if: steps.init.outputs.run_build == 'yes'
        run: |
          set +e
          echo "===== $(date) Versions information"
          php -i | head -
          echo "PHP version"
          php -v | head -
          echo "PHPCS version"
          which phpcs && phpcs --version | head -
          echo "PHPUnit version"
          which phpunit && phpunit --version | head -
          echo "Apache version"
          apache2 -v | head -
          echo "Database version"
          mysql --version | head -
          psql --version
          pgloader --version
          echo "===== $(date) end ====="

      # Port of the before_install and before_script sections about the databases
      - name: Setting up database
        if: steps.init.outputs.run_build == 'yes'
        run: |
          set -o pipefail
          echo "===== $(date) Setting up pgsql if run is for pgsql"
          if [ "$DB" = 'postgresql' ]; then
            sudo sed -i -e '/local.*peer/s/postgres/all/' -e 's/peer\|md5/trust/g' /etc/postgresql/14/main/pg_hba.conf
            sudo cat /etc/postgresql/14/main/pg_hba.conf
            sudo service postgresql restart
            psql postgresql://postgres:postgres@127.0.0.1:5432 -l -A
            psql postgresql://postgres:postgres@127.0.0.1:5432 -c 'create database travis;'
            psql postgresql://postgres:postgres@127.0.0.1:5432 -c "CREATE USER travis WITH ENCRYPTED PASSWORD 'travis';"
            psql postgresql://postgres:postgres@127.0.0.1:5432 -c 'GRANT ALL PRIVILEGES ON DATABASE travis TO travis;'
          fi

          echo "===== $(date) Setting up mariadb"
          if [ "$DB" = 'mysql' ] || [ "$DB" = 'mariadb' ] || [ "$DB" = 'postgresql' ]; then
            echo "MySQL stop"
            sudo systemctl stop mariadb.service
            echo "MySQL restart without pass"
            sudo mysqld_safe --skip-grant-tables --socket=/tmp/aaa &
            # Wait the server answers (a "sleep 3" is enough on the travis runner)
            for i in $(seq 1 30); do
              sudo mysqladmin -h 127.0.0.1 ping >/dev/null 2>&1 && break
              sleep 2
            done
            echo "MySQL set root password"
            sudo mysql -u root -h 127.0.0.1 -e "FLUSH PRIVILEGES; CREATE DATABASE IF NOT EXISTS travis CHARACTER SET = 'utf8mb4'; ALTER USER 'root'@'localhost' IDENTIFIED BY 'password'; CREATE USER 'root'@'127.0.0.1' IDENTIFIED BY 'password'; CREATE USER 'travis'@'127.0.0.1' IDENTIFIED BY 'password'; GRANT ALL PRIVILEGES ON travis.* TO root@127.0.0.1; GRANT ALL PRIVILEGES ON travis.* TO travis@127.0.0.1; FLUSH PRIVILEGES;"
            echo "MySQL grant"
            sudo mysql -u root -h 127.0.0.1 -ppassword -e 'FLUSH PRIVILEGES; GRANT ALL PRIVILEGES ON travis.* TO travis@127.0.0.1; FLUSH PRIVILEGES;'
            echo "MySQL list current users"
            sudo mysql -u root -h 127.0.0.1 -ppassword -e 'use mysql; select * from user;' | head -20
            echo "MySQL load sql"
            sudo mysql -u root -h 127.0.0.1 -ppassword -D travis < dev/initdemo/mysqldump_dolibarr_3.5.0.sql
          fi

          echo "===== $(date) Migrating mariadb to pgsql if run is for pgsql"
          if [ "$DB" = 'postgresql' ]; then
            sudo mkdir -p /tmp/pgloader
            sudo chmod -R a+rwx /tmp/pgloader/
            sudo pgloader 'mysql://root:password@127.0.0.1/travis' 'postgresql://postgres:postgres@127.0.0.1:5432/travis'
            echo 'ALTER SEQUENCE llx_accountingaccount_rowid_seq RENAME TO llx_accounting_account_rowid_seq' | psql 'postgresql://postgres:postgres@127.0.0.1:5432/travis'
            echo 'ALTER SEQUENCE llx_accounting_account_rowid_seq RESTART WITH 1000001;' | psql 'postgresql://postgres:postgres@127.0.0.1:5432/travis'
            # Create pgsql compatibility functions
            echo "Load functions.sql (may generated errors for tables that does not exists yet)"
            psql 'postgresql://postgres:postgres@127.0.0.1:5432/travis' < htdocs/install/pgsql/functions/functions.sql
          fi
          echo "===== $(date) end ====="

      # Port of the before_script section
      - name: Generate dolibarr conf.php file
        if: steps.init.outputs.run_build == 'yes'
        run: |
          set -o pipefail
          echo "===== $(date) Generate dolibarr conf.php file"
          export CONF_FILE=htdocs/conf/conf.php
          echo "Setting up Dolibarr '$CONF_FILE'"
          echo '<?php' > $CONF_FILE
          echo 'error_reporting(E_ALL);' >> $CONF_FILE
          echo '$'dolibarr_main_url_root=\'http://127.0.0.1\'';' >> $CONF_FILE
          echo '$'dolibarr_main_document_root=\'$TRAVIS_BUILD_DIR/htdocs\'';' >> $CONF_FILE
          echo '$'dolibarr_main_data_root=\'$TRAVIS_BUILD_DIR/documents\'';' >> $CONF_FILE
          echo '$'dolibarr_main_db_host=\'127.0.0.1\'';' >> $CONF_FILE
          echo '$'dolibarr_main_db_name=\'travis\'';' >> $CONF_FILE
          echo '$'dolibarr_main_db_character=\'utf8mb4\'';' >> $CONF_FILE
          echo '$'dolibarr_main_instance_unique_id=\'travis1234567890\'';' >> $CONF_FILE
          if [ "$DB" = 'mysql' ] || [ "$DB" = 'mariadb' ]; then
            echo '$'dolibarr_main_db_type=\'mysqli\'';' >> $CONF_FILE
            echo '$'dolibarr_main_db_port=3306';' >> $CONF_FILE
            echo '$'dolibarr_main_db_user=\'root\'';' >> $CONF_FILE
            echo '$'dolibarr_main_db_pass=\'password\'';' >> $CONF_FILE
          fi
          if [ "$DB" = 'postgresql' ]; then
            echo '$'dolibarr_main_db_type=\'pgsql\'';' >> $CONF_FILE
            echo '$'dolibarr_main_db_port=5432';' >> $CONF_FILE
            echo '$'dolibarr_main_db_user=\'postgres\'';' >> $CONF_FILE
            echo '$'dolibarr_main_db_pass=\'postgres\'';' >> $CONF_FILE
          fi
          echo '$'dolibarr_main_authentication=\'dolibarr\'';' >> $CONF_FILE
          cat $CONF_FILE
          echo "===== $(date) end ====="

      # Port of the before_script section
      - name: Create documents directory and set permissions
        if: steps.init.outputs.run_build == 'yes'
        run: |
          set -o pipefail
          echo "===== $(date) Create documents directory and set permissions"
          # Add admin/temp subdirectory needed for unit tests
          mkdir -p $TRAVIS_BUILD_DIR/documents/admin/temp
          sudo chmod -R a+rwx $TRAVIS_BUILD_DIR/documents
          echo "***** First line of dolibarr.log" > $TRAVIS_BUILD_DIR/documents/dolibarr.log
          echo "===== $(date) end ====="

      # Port of the before_script section: the travis user of the runner is
      # "runner" instead of "travis"
      - name: Setting up Apache
        if: steps.init.outputs.run_build == 'yes'
        run: |
          set -o pipefail
          echo "===== $(date) Setting up Apache"
          sudo sed -i -e "s,www-data,runner,g" /etc/apache2/envvars
          sudo cp -f dev/build/travis-ci/apache.conf /etc/apache2/sites-available/000-default.conf
          sudo sed -e "s?%TRAVIS_BUILD_DIR%?$TRAVIS_BUILD_DIR?g" --in-place /etc/apache2/sites-available/000-default.conf
          sudo cat /etc/apache2/sites-available/000-default.conf
          sudo service apache2 restart
          echo "===== $(date) end ====="

      # Port of the script section
      - name: Checking webserver availability
        if: steps.init.outputs.run_build == 'yes'
        run: |
          set +e
          echo "===== $(date) Checking webserver availability by a wget -O - --debug http://127.0.0.1"
          # The wget should return a page with line '<meta name="generator" content="Dolibarr installer">'
          wget -O - --debug http://127.0.0.1 > test.html
          head -n 200 test.html
          sudo cat /var/log/apache2/travis_error_log
          echo "===== $(date) end ====="

      # Port of the script section
      - name: Checking PHP syntax errors with parallel-lint
        if: steps.init.outputs.run_build == 'yes'
        run: |
          set -o pipefail
          echo "===== $(date) Checking PHP syntax errors with parallel-lint"
          if [ "x$TRAVIS_RUN_PARALLELLINT" = "xyes" ]; then
            parallel-lint -e php --exclude dev/tools/test --exclude dev/tools/phan --exclude htdocs/includes/composer --exclude htdocs/includes/myclabs --exclude htdocs/includes/phpspec --exclude dev/initdata/dbf/includes \
              --exclude htdocs/includes/sabre --exclude htdocs/includes/phpoffice/PhpSpreadsheet --exclude htdocs/includes/sebastian \
              --exclude htdocs/includes/squizlabs/php_codesniffer --exclude htdocs/includes/jakub-onderka --exclude htdocs/includes/php-parallel-lint --exclude htdocs/includes/symfony \
              --exclude htdocs/includes/mike42/escpos-php/example --exclude htdocs/includes/maximebf \
              --exclude htdocs/includes/phpunit/ --exclude htdocs/includes/tecnickcom/tcpdf/include/barcodes --exclude htdocs/includes/webmozart --exclude htdocs/includes/webklex --blame .
          else
            echo "Skipped"
          fi
          echo "===== $(date) end ====="

      # Port of the script section: for a pull request, we check only the php
      # files it changes, the list has been recorded by the init step
      - name: Checking coding style with codesniffer
        if: steps.init.outputs.run_build == 'yes'
        run: |
          set -o pipefail
          echo "===== $(date) Checking coding style with codesniffer"
          CACHE_OPT="--cache=${HOME}/.cache/dolibarr-phpcs-${TRAVIS_PHP_VERSION}.cache"
          PHPCS_FILES=.
          if [ -n "${changed_files:-}" ] && ! echo "$changed_files" | grep -qE '^(dev/setup/codesniffer/|\.travis\.yml$)'; then
            PHPCS_FILES=$(echo "$changed_files" | grep -E '\.php$' | while read -r f; do if [ -f "$f" ]; then echo "$f"; fi; done)
          fi
          if [ "x$TRAVIS_RUN_PHPCS" = "xyes" ] && [ -z "$PHPCS_FILES" ]; then
            echo "No php file changed by the pull request"
          elif [ "x$TRAVIS_RUN_PHPCS" = "xyes" ]; then
            phpcs -s -p -d memory_limit=-1 --extensions=php --colors --tab-width=4 --standard=dev/setup/codesniffer/ruleset.xml --encoding=utf-8 --severity=1 ${CACHE_OPT} --runtime-set ignore_warnings_on_exit true $PHPCS_FILES
          else
            echo "Skipped"
          fi
          echo "===== $(date) end ====="

      # Port of the script section
      - name: Setting up Dolibarr install.forced.php to test installation
        if: steps.init.outputs.run_build == 'yes'
        run: |
          set -o pipefail
          echo "===== $(date) Setting up Dolibarr install.forced.php to test installation"
          export INSTALL_FORCED_FILE=htdocs/install/install.forced.php
          echo '<?php ' > $INSTALL_FORCED_FILE
          echo 'error_reporting(E_ALL);' >> $INSTALL_FORCED_FILE
          echo '$'force_install_noedit=2';' >> $INSTALL_FORCED_FILE
          if [ "$DB" = 'mysql' ] || [ "$DB" = 'mariadb' ]; then
            echo '$'force_install_type=\'mysqli\'';' >> $INSTALL_FORCED_FILE
            echo '$'force_install_port=3306';' >> $INSTALL_FORCED_FILE
          fi
          if [ "$DB" = 'postgresql' ]; then
            echo '$'force_install_type=\'pgsql\'';' >> $INSTALL_FORCED_FILE
            echo '$'force_install_port=5432';' >> $INSTALL_FORCED_FILE
          fi
          echo '$'force_install_dbserver=\'127.0.0.1\'';' >> $INSTALL_FORCED_FILE
          echo '$'force_install_database=\'travis\'';' >> $INSTALL_FORCED_FILE
          echo '$'force_install_databaselogin=\'travis\'';' >> $INSTALL_FORCED_FILE
          echo '$'force_install_databasepass=\'\'';' >> $INSTALL_FORCED_FILE
          echo '$'force_install_prefix=\'llx_\'';' >> $INSTALL_FORCED_FILE
          echo '$'force_install_createdatabase=false';' >> $INSTALL_FORCED_FILE
          echo '$'force_install_createuser=false';' >> $INSTALL_FORCED_FILE
          echo '$'force_install_mainforcehttps=false';' >> $INSTALL_FORCED_FILE
          echo '$'force_install_main_data_root=\'$TRAVIS_BUILD_DIR/htdocs\'';' >> $INSTALL_FORCED_FILE
          cat $INSTALL_FORCED_FILE
          echo "===== $(date) end ====="

      # Port of the script section
      - name: Upgrading Dolibarr
        if: steps.init.outputs.run_build == 'yes'
        run: |
          echo "===== $(date) Upgrading Dolibarr"
          # We keep set +e like .travis.yml: with pgsql, one of the upgrade process fails even if the
          # migration seems ok, and the failed migrations are also shown by the cat of the logs.
          set +e
          cd "$TRAVIS_BUILD_DIR/htdocs/install"
          php upgrade.php 3.5.0 3.6.0 ignoredbversion > $TRAVIS_BUILD_DIR/upgrade350360.log
          php upgrade2.php 3.5.0 3.6.0 > $TRAVIS_BUILD_DIR/upgrade350360-2.log
          php step5.php 3.5.0 3.6.0 > $TRAVIS_BUILD_DIR/upgrade350360-3.log
          php upgrade.php 3.6.0 3.7.0 ignoredbversion > $TRAVIS_BUILD_DIR/upgrade360370.log
          php upgrade2.php 3.6.0 3.7.0 > $TRAVIS_BUILD_DIR/upgrade360370-2.log
          php step5.php 3.6.0 3.7.0 > $TRAVIS_BUILD_DIR/upgrade360370-3.log
          php upgrade.php 3.7.0 3.8.0 ignoredbversion > $TRAVIS_BUILD_DIR/upgrade370380.log
          php upgrade2.php 3.7.0 3.8.0 > $TRAVIS_BUILD_DIR/upgrade370380-2.log
          php step5.php 3.7.0 3.8.0 > $TRAVIS_BUILD_DIR/upgrade370380-3.log
          php upgrade.php 3.8.0 3.9.0 ignoredbversion > $TRAVIS_BUILD_DIR/upgrade380390.log
          php upgrade2.php 3.8.0 3.9.0 > $TRAVIS_BUILD_DIR/upgrade380390-2.log
          php step5.php 3.8.0 3.9.0 > $TRAVIS_BUILD_DIR/upgrade380390-3.log
          php upgrade.php 3.9.0 4.0.0 ignoredbversion > $TRAVIS_BUILD_DIR/upgrade390400.log
          php upgrade2.php 3.9.0 4.0.0 > $TRAVIS_BUILD_DIR/upgrade390400-2.log
          php step5.php 3.9.0 4.0.0 > $TRAVIS_BUILD_DIR/upgrade390400-3.log
