name: "Close old PRs with Works for me / Can't reproduce label"

on:
  schedule:
    - cron: "0 21 * * 3"

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  close-old-labeled-prs:
    runs-on: ubuntu-latest

    steps:
      - name: Find and close old PRs with Works for me / Can't reproduce label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          SIX_MONTHS_AGO=$(date -d "6 months ago" --iso-8601=seconds)

          echo "Looking for open PRs with 'Works for me / Can't reproduce' label not updated since: $SIX_MONTHS_AGO"

          CLOSED_COUNT=0
          MAX_CLOSED=20

          gh pr list \
            --repo "$REPO" \
            --state open \
            --limit 1000 \
            --label "Works for me / Can't reproduce" \
            --json number,title,createdAt,updatedAt,labels |
          jq -c '.[] | select(.updatedAt < "'"$SIX_MONTHS_AGO"'")' |
          while IFS= read -r PR; do

            PR_NUMBER=$(echo "$PR" | jq -r '.number')
            PR_TITLE=$(echo "$PR" | jq -r '.title')
            CREATED_AT=$(echo "$PR" | jq -r '.createdAt')
            UPDATED_AT=$(echo "$PR" | jq -r '.updatedAt')

            echo ""
            echo "========================================"
            echo "PR #$PR_NUMBER: $PR_TITLE"
            echo "Created:      $CREATED_AT"
            echo "Last updated: $UPDATED_AT"
            echo "========================================"

            # Verify the label is present
            LABELS=$(echo "$PR" | jq -r '[.labels[].name] | join(", ")')
            echo "Labels: $LABELS"

            HAS_LABEL=$(echo "$PR" | jq -r '[.labels[].name] | any(.[]; . == "Works for me / Can\'t reproduce")')

            if [ "$HAS_LABEL" = "true" ]; then

              echo "PR #$PR_NUMBER has the required label."

              COMMENT="This PR has been closed automatically because it has not been updated for more than 6 months and has the label 'Works for me / Can't reproduce'. If the issue is still relevant, please reopen the PR and provide additional context or a reproducible test case."

              echo "Closing PR #$PR_NUMBER"

              gh pr close "$PR_NUMBER" \
                --repo "$REPO" \
                --comment "$COMMENT"

              CLOSED_COUNT=$((CLOSED_COUNT + 1))

              echo "Closed PRs: $CLOSED_COUNT/$MAX_CLOSED"

              if [ "$CLOSED_COUNT" -ge "$MAX_CLOSED" ]; then
                echo "Reached the maximum number of PRs to close. Stopping."
                break
              fi

            else
              echo "PR #$PR_NUMBER does not have the required label. Keeping it open."
            fi

          done
