name: Apply multilangs PHPStan fix (temporary)

on:
  push:
    branches: [fetch-cti-phpstan-debt]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-phpstan-multilangs-commonobjectline

      - name: Show php config
        run: php -v && ls dev/build/phpstan/

      - name: Download phpstan
        run: |
          curl -sL -o $HOME/phpstan.phar https://github.com/phpstan/phpstan/releases/download/2.2.14/phpstan.phar
          php $HOME/phpstan.phar --version

      - name: Run phpstan before fix
        continue-on-error: true
        run: |
          php $HOME/phpstan.phar analyse --level 9 -a dev/build/phpstan/bootstrap_action.php --memory-limit 5G --no-progress htdocs/core/class/commonobjectline.class.php htdocs/comm/propal/class/propal.class.php htdocs/commande/class/commande.class.php > $HOME/phpstan-before.txt 2>&1 || true
          wc -l $HOME/phpstan-before.txt

      - name: Apply fix
        run: |
          python3 - <<'PYEOF'
          path = 'htdocs/core/class/commonobjectline.class.php'
          with open(path, 'r', encoding='utf-8', newline='') as f:
              content = f.read()

          old = '@var ?array<string,array<string,string>>'
          new = '@var ?array<string,array{rowid?:int,label:string,description:string,note?:string,other?:string,array_options?:array<string,mixed>}>'

          lines = content.splitlines(True)
          idx = [i for i, l in enumerate(lines) if l.strip() == 'public $multilangs;']
          assert len(idx) == 1, 'expected exactly one public $multilangs declaration, got %d' % len(idx)
          i = idx[0]
          replaced = False
          for j in range(max(0, i - 6), i):
              if old in lines[j]:
                  lines[j] = lines[j].replace(old, new)
                  replaced = True
          assert replaced, 'did not find the @var doc line to replace'
          content = ''.join(lines)
          with open(path, 'w', encoding='utf-8', newline='') as f:
              f.write(content)
          print('Fix applied')
          PYEOF

      - name: Run phpstan after fix
        continue-on-error: true
        run: |
          php $HOME/phpstan.phar analyse --level 9 -a dev/build/phpstan/bootstrap_action.php --memory-limit 5G --no-progress htdocs/core/class/commonobjectline.class.php htdocs/comm/propal/class/propal.class.php htdocs/commande/class/commande.class.php > $HOME/phpstan-after.txt 2>&1 || true
          wc -l $HOME/phpstan-after.txt
          grep -c 'multilangs' $HOME/phpstan-after.txt || echo 'no multilangs warning left'

      - name: Commit fix on fix branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add htdocs/core/class/commonobjectline.class.php
          git commit -m "QUAL: Fix PHPStan warnings on multilangs property of CommonObjectLine" -m "The PHPDoc of CommonObjectLine::\$multilangs declared array<string, array<string, string>> while this property is only filled with the Product::\$multilangs array, whose translation values can also be int (rowid) or array (array_options). Align the @var type on the shape of Product::\$multilangs so the assignments into fetch_lines() of propal and commande are accepted." -m "Generated by Vibe"
          git push origin HEAD:fix-phpstan-multilangs-commonobjectline

      - name: Save phpstan results on temp branch
        run: |
          cp $HOME/phpstan-before.txt /tmp/phpstan-before.txt
          cp $HOME/phpstan-after.txt /tmp/phpstan-after.txt
          git checkout -f fetch-cti-phpstan-debt
          cp /tmp/phpstan-before.txt /tmp/phpstan-after.txt .
          git add phpstan-before.txt phpstan-after.txt
          git commit -m "chore: phpstan validation results [skip ci]" || echo "nothing"
          git push
