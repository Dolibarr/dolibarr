name: Validate multilangs fix with phpstan (temporary)

on:
  push:
    branches: [fetch-cti-phpstan-debt]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-phpstan-multilangs-commonobjectline
          fetch-depth: 0

      - name: Download phpstan
        run: |
          curl -sL -o $HOME/phpstan.phar https://github.com/phpstan/phpstan/releases/download/2.2.14/phpstan.phar
          php $HOME/phpstan.phar --version > /tmp/phpstan-version.txt 2>&1 || true

      - name: Run phpstan after fix (on fix branch)
        continue-on-error: true
        run: |
          php $HOME/phpstan.phar analyse --level 9 -a dev/build/phpstan/bootstrap_action.php --memory-limit 5G --no-progress htdocs/core/class/commonobjectline.class.php htdocs/comm/propal/class/propal.class.php htdocs/commande/class/commande.class.php > /tmp/phpstan-after.txt 2>&1 || true
          tail -5 /tmp/phpstan-after.txt

      - name: Run phpstan before fix (revert file to develop version)
        continue-on-error: true
        run: |
          git show origin/develop:htdocs/core/class/commonobjectline.class.php > htdocs/core/class/commonobjectline.class.php
          php $HOME/phpstan.phar analyse --level 9 -a dev/build/phpstan/bootstrap_action.php --memory-limit 5G --no-progress htdocs/core/class/commonobjectline.class.php htdocs/comm/propal/class/propal.class.php htdocs/commande/class/commande.class.php > /tmp/phpstan-before.txt 2>&1 || true
          tail -5 /tmp/phpstan-before.txt

      - name: Publish results on temp branch
        run: |
          git checkout -- htdocs/core/class/commonobjectline.class.php
          git fetch origin fetch-cti-phpstan-debt
          git checkout -f FETCH_HEAD
          cp /tmp/phpstan-version.txt /tmp/phpstan-before.txt /tmp/phpstan-after.txt .
          git add phpstan-version.txt phpstan-before.txt phpstan-after.txt
          git commit -m "chore: phpstan validation results [skip ci]" || echo "nothing"
          git push origin HEAD:fetch-cti-phpstan-debt
