name: Extract code sections 2 (temporary)

on:
  push:
    branches: [fetch-cti-phpstan-debt]

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract code sections
        run: |
          python3 - <<'PYEOF'
          NL = chr(10)

          def dump(path, a, b, out):
              with open(path, 'r', encoding='utf-8', errors='replace') as f:
                  lines = f.readlines()
              res = []
              for i in range(a - 1, min(b, len(lines))):
                  res.append('%d' % (i + 1) + chr(9) + lines[i].rstrip(chr(10)) + NL)
              with open(out, 'w') as f:
                  f.write(''.join(res))

          import re
          for src in ['htdocs/core/class/commonobject.class.php', 'htdocs/product/class/product.class.php', 'htdocs/core/class/commonobjectline.class.php']:
              try:
                  with open(src, 'r', encoding='utf-8', errors='replace') as f:
                      lines = f.readlines()
              except FileNotFoundError:
                  continue
              for i, l in enumerate(lines):
                  if re.search(r'(class\s+CommonObjectLine|public\s+\$multilangs|function\s+getMultiLangs)', l):
                      a = max(0, i - 12)
                      b = min(len(lines), i + 30)
                      name = 'dump-%s-%d.txt' % (src.replace('/', '_').replace('.', '_'), i + 1)
                      dump(src, a + 1, b, name)
          PYEOF

      - name: Commit extracted data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dump-*.txt
          git commit -m "chore: extract class sections [skip ci]" || echo "nothing to commit"
          git push
