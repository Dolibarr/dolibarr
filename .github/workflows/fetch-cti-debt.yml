name: Extract code sections (temporary)

on:
  push:
    branches: [fetch-cti-phpstan-debt]

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract code sections
        run: |
          python3 - <<'PYEOF'
          NL = chr(10)

          def dump(path, a, b, out):
              with open(path, 'r', encoding='utf-8', errors='replace') as f:
                  lines = f.readlines()
              res = []
              for i in range(a - 1, min(b, len(lines))):
                  res.append('%d' % (i + 1) + chr(9) + lines[i].rstrip(chr(10)) + NL)
              with open(out, 'w') as f:
                  f.write(''.join(res))

          dump('htdocs/comm/propal/class/propal.class.php', 2020, 2140, 'code-propal.txt')
          dump('htdocs/commande/class/commande.class.php', 2290, 2410, 'code-commande.txt')

          # Dump every line mentioning multilangs in CommonObjectLine and propal/commande classes, with context info
          for src, out in [('htdocs/core/class/commonobject.class.php', 'code-multilangs-commonobject.txt'),
                           ('htdocs/comm/propal/class/propal.class.php', 'code-multilangs-propal.txt'),
                           ('htdocs/commande/class/commande.class.php', 'code-multilangs-commande.txt'),
                           ('htdocs/core/class/commonobjectline.class.php', 'code-multilangs-line.txt')]:
              try:
                  with open(src, 'r', encoding='utf-8', errors='replace') as f:
                      lines = f.readlines()
              except FileNotFoundError:
                  continue
              res = []
              for i, l in enumerate(lines):
                  if 'multilangs' in l.lower():
                      res.append('%d' % (i + 1) + chr(9) + l.rstrip(chr(10)) + NL)
              with open(out, 'w') as f:
                  f.write(''.join(res))
          PYEOF

      - name: Commit extracted data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add code-*.txt
          git commit -m "chore: extract code sections [skip ci]" || echo "nothing to commit"
          git push
