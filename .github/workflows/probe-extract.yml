name: Probe extract lines 3

on:
  push:
    branches: [probe-phpstan-cti-report]

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: probe-phpstan-cti-report
      - name: Extract lines
        run: |
          printf 'dict.php getTitleFieldOfList + sortable context\n' > probe-lines3.txt
          grep -n 'sortable' htdocs/admin/dict.php >> probe-lines3.txt || true
          grep -n -B2 -A2 'getTitleFieldOfList($valuetoshow' htdocs/admin/dict.php >> probe-lines3.txt || true
          printf '\ndict.php id != 10 context\n' >> probe-lines3.txt
          grep -n -B2 -A4 'id != 10\|id != 3' htdocs/admin/dict.php >> probe-lines3.txt || true
          printf '\nother journals-like files with same patterns\n' >> probe-lines3.txt
          grep -rn 'sortable ? ' htdocs/accountancy/admin/*.php >> probe-lines3.txt || true
          grep -rn 'id != 10' htdocs/accountancy/admin/*.php >> probe-lines3.txt || true
      - name: Commit extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add probe-lines3.txt
          git commit -m "[skip ci] Add extraction 3" || echo "nothing to commit"
          git pull --rebase || true
          git push
