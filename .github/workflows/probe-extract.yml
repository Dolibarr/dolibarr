name: Probe extract lines 2

on:
  push:
    branches: [probe-phpstan-cti-report]

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: probe-phpstan-cti-report
      - name: Extract lines with exact bytes
        run: |
          printf 'lines 1-140 of journals_list.php\n' > probe-lines2.txt
          sed -n '1,140p' htdocs/accountancy/admin/journals_list.php | cat -n >> probe-lines2.txt
          printf '\nlines 440-560\n' >> probe-lines2.txt
          awk 'NR>=440 && NR<=560 {printf "%d:%s\n", NR, $0}' htdocs/accountancy/admin/journals_list.php >> probe-lines2.txt
          printf '\nlines 605-640\n' >> probe-lines2.txt
          awk 'NR>=605 && NR<=640 {printf "%d:%s\n", NR, $0}' htdocs/accountancy/admin/journals_list.php >> probe-lines2.txt
          printf '\noccurrences of id= sortable= page= in file\n' >> probe-lines2.txt
          grep -n 'sortable' htdocs/accountancy/admin/journals_list.php >> probe-lines2.txt || true
          grep -n '\$id ' htdocs/accountancy/admin/journals_list.php | head -20 >> probe-lines2.txt || true
          grep -n "\$page" htdocs/accountancy/admin/journals_list.php | head -20 >> probe-lines2.txt || true
      - name: Commit extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add probe-lines2.txt
          git commit -m "[skip ci] Add extraction 2" || echo "nothing to commit"
          git pull --rebase || true
          git push
