name: "CI-PULL-REQUEST"

on:
  pull_request:
    paths-ignore:
      - '.agents/**'

jobs:
  pre-commit:
    uses: ./.github/workflows/pre-commit.yml
    secrets: inherit
    with:
      gh_event: ${{ github.event_name }}
  phan:
    # if: false   # Uncommenting this line disables phan
    uses: ./.github/workflows/phan.yml
    secrets: inherit
    needs: [pre-commit]
    with:
      gh_event: ${{ github.event_name }}
  phpstan:
    uses: ./.github/workflows/phpstan.yml
    secrets: inherit
    needs: [pre-commit]
    with:
      gh_event: ${{ github.event_name }}
  #windows-ci:
  #  needs: [pre-commit, phan, phpstan]
  #  secrets: inherit
  #  uses: ./.github/workflows/windows-ci.yml
  #  with:
  #    gh_event: ${{ github.event_name }}
  gh-travis:  # Runs travis script on github runner (not on travis)
    # The build (install + database upgrade + phpunit) is long, so it is run
    # only when a changed file may change its result, and only once the cheap
    # checks passed. The default is to run it: it is skipped only when
    # get_changed_php.sh could tell that no relevant file was modified.
    # Add the label "ci: full" on the pull request to force the build.
    # To also skip the build while the pull request is a draft, add
    # "&& github.event.pull_request.draft == false" to the condition.
    if: >-
      needs.pre-commit.outputs.travis_changed != 'false'
      || contains(github.event.pull_request.labels.*.name, 'ci: full')
    # needs: [windows-ci]
    secrets: inherit
    needs: [pre-commit, phan, phpstan]
    uses: ./.github/workflows/gh-travis.yml
    with:
      gh_event: ${{ github.event_name }}
