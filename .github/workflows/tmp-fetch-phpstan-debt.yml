name: Fetch PHPStan technical debt
on:
  push:
    branches: [tmp-fetch-phpstan-debt]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download page
        run: curl -sL --max-time 120 https://cti.dolibarr.org/ -o page.html
      - name: Extract text and chunks
        run: python3 dev/tmp_extract_cti.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cti_part*.txt page.txt
          git commit -m "Save cti page chunks" || echo "nothing to commit"
          git push
