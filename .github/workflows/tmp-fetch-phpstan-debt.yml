name: Extract code context
on:
  push:
    branches: [tmp-fetch-phpstan-debt]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run extraction
        run: python3 dev/tmp_extract_context.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cti_extract2.txt
          git commit -m "Save code context" || echo "nothing to commit"
          git push
