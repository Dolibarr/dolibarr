name: Verify and push phpstan fix
on:
  push:
    branches: [tmp-fetch-phpstan-debt]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          extensions: calendar, json, imagick, gd, zip, mbstring, intl, opcache, imap, mysql, pgsql, sqlite3, ldap, xml
      - name: Install PHPStan 2.2.14
        run: |
          curl -sL https://github.com/phpstan/phpstan/releases/download/2.2.14/phpstan.phar -o phpstan.phar
          php phpstan.phar --version
      - name: Write helper scripts
        run: |
          echo '' | base64 -d > make_config.py
          echo '' | base64 -d > patch_file.py
          echo '' | base64 -d > compare.py
      - name: Make phpstan config (level 9, no baseline)
        run: python3 make_config.py
      - name: Run PHPStan on develop (baseline)
        run: |
          php phpstan.phar analyse --no-progress -v --memory-limit 5G -a dev/build/phpstan/bootstrap.php -c phpstan_apstats_ci.neon > /tmp/phpstan_base.txt 2>&1 || true
          tail -n 5 /tmp/phpstan_base.txt
      - name: Apply patch
        run: python3 patch_file.py
      - name: Run PHPStan with patch
        run: |
          php phpstan.phar analyse --no-progress -v --memory-limit 5G -a dev/build/phpstan/bootstrap.php -c phpstan_apstats_ci.neon > /tmp/phpstan_patched.txt 2>&1 || true
          tail -n 5 /tmp/phpstan_patched.txt
      - name: Compare results
        run: python3 compare.py
      - name: Gate check
        run: |
          if grep -q "multilangs" /tmp/phpstan_patched.txt; then
            echo "multilangs warning still present in patched run"
            exit 1
          fi
          if python3 compare.py | grep -q "NEW WARNINGS INTRODUCED"; then
            echo "new warnings introduced"
            python3 compare.py
            exit 1
          fi
          echo "Gate check passed"
      - name: Push fix branch
        run: |
          git config user.name "eldy"
          git config user.email "eldy@destailleur.fr"
          git checkout -b fix-phpstan-multilangs
          git add htdocs/core/class/commonobjectline.class.php
          git commit -m "QUAL: Fix PHPStan warnings on property CommonObjectLine::$multilangs" -m "The PHPDoc of CommonObjectLine::$multilangs was declared as ?array<string,array<string,string>> but the property is only filled from Product::$multilangs, whose values also contain an int rowid and an array array_options. Align the PHPDoc shape with Product::$multilangs so the assignments into propal/commande/facture/contrat fetch_lines() are valid and the level 9 warnings reported on https://cti.dolibarr.org/ disappear.

Generated by Vibe"
          git push origin fix-phpstan-multilangs
      - name: Save outputs on tmp branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin tmp-fetch-phpstan-debt
          git checkout tmp-fetch-phpstan-debt
          mkdir -p tmp-verify
          cp /tmp/phpstan_base.txt /tmp/phpstan_patched.txt /tmp/phpstan_diff.txt tmp-verify/ || true
          git add tmp-verify
          git commit -m "Save phpstan verification outputs" || echo "nothing to commit"
          git push origin tmp-fetch-phpstan-debt
