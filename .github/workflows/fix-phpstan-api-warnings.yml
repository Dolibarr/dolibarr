name: Temp patch PHPStan api warnings (v2)

on:
  push:
    branches:
      - fix-phpstan-api-warnings

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix-phpstan-api-warnings

      - name: Patch PHP files
        run: |
          python3 - <<'PYEOF'
          import re
          import pathlib

          status = []

          def patch(path, pat, repl):
              p = pathlib.Path(path)
              s = p.read_text()
              s2, n = pat.subn(repl, s)
              status.append("%s: %d match(es)" % (path, n))
              if n == 1:
                  p.write_text(s2)
              m = pat.search(s)
              if m:
                  status.append("CONTEXT: " + repr(m.group(0)[:400]))

          pat1 = re.compile(r"(\* @url\s+GET /modules\s*\n\s*\*\n\s*\* @return\s+)array(\s+Data without useless information\s*\n\s*\* @phan-return\s+)array<string,string>")
          patch('htdocs/api/class/api_setup.class.php', pat1, r"\g<1>list<string>\g<2>list<string>")

          pat2 = re.compile(r"\$url = \(isset\(\$_SERVER\['SCRIPT_URI'\]\) && \$_SERVER\[\"SCRIPT_URI\"\] !== null\) \? \$_SERVER\[\"SCRIPT_URI\"\] : \$_SERVER\['PHP_SELF'\];")
          patch('htdocs/api/index.php', pat2, r"$url = $_SERVER['SCRIPT_URI'] ?? $_SERVER['PHP_SELF'];")

          pathlib.Path('patch-status.txt').write_text("\n".join(status) + "\n")
          print("\n".join(status))
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "Laurent Destailleur"
          git config user.email "eldy@destailleur.fr"
          git add htdocs/api/class/api_setup.class.php htdocs/api/index.php patch-status.txt
          git commit -q -m "Qual: apply PHPStan fixes on branch"
          git push
