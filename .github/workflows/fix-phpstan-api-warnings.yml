name: Temp patch PHPStan api warnings (v3)

on:
  push:
    branches:
      - fix-phpstan-api-warnings

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix-phpstan-api-warnings

      - name: Patch PHP file
        run: |
          python3 - <<'PYEOF'
          import re
          import pathlib

          p = pathlib.Path('htdocs/api/class/api_setup.class.php')
          s = p.read_text()
          pat = re.compile(r"(\* @phan-return\s+list<string>\n\s*\* @phpstan-return\s+)array<string,string>")
          s2, n = pat.subn(r"\g<1>list<string>", s)
          if n != 1:
              pathlib.Path('patch-status.txt').write_text("phpstan-return: %d match(es)" % n)
              raise SystemExit(1)
          p.write_text(s2)
          print("patch OK")
          PYEOF

      - name: Commit and push
        if: always()
        run: |
          git config user.name "Laurent Destailleur"
          git config user.email "eldy@destailleur.fr"
          git rm -q --ignore-unmatch patch-status.txt
          git rm -q .github/workflows/fix-phpstan-api-warnings.yml
          git add htdocs/api/class/api_setup.class.php
          git commit -s -q -m "Qual: Fix PHPStan warnings into api module" -m "- Setup::getModules() should return array but returns list: the return type of the deprecated endpoint is now declared as list<string>" -m "- api/index.php: strict comparison using !== between mixed and null will always evaluate to true, replaced by ?? operator"
          git push
