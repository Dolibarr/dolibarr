name: tmp-cti-fix

on:
  push:
    branches:
      - tmp-cti-vibe-20261005
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout scratch branch
        uses: actions/checkout@v4
        with:
          ref: tmp-cti-vibe-20261005
          fetch-depth: 1

      - name: Fetch develop and detect phase
        run: |
          git config user.name "eldy"
          git config user.email "eldy@destailleur.fr"
          git fetch origin develop --depth=1
          git fetch origin tmp-cti-vibe-20261005 --depth=1
          if git cat-file -e origin/tmp-cti-vibe-20261005:GO 2>/dev/null; then
            echo "PHASE=finalize" >> "$GITHUB_ENV"
          elif git cat-file -e origin/tmp-cti-vibe-20261005:phpstan-after.txt 2>/dev/null; then
            echo "PHASE=done" >> "$GITHUB_ENV"
          else
            echo "PHASE=analyse" >> "$GITHUB_ENV"
          fi

      - name: Prepare work tree from develop
        run: git checkout -B work origin/develop

      - name: Setup PHP
        if: ${{ env.PHASE == 'analyse' }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Download PHPStan 2.2.14
        if: ${{ env.PHASE == 'analyse' }}
        run: |
          wget -q https://github.com/phpstan/phpstan/releases/download/2.2.14/phpstan.phar
          chmod +x phpstan.phar

      - name: Run PHPStan before the fix
        if: ${{ env.PHASE == 'analyse' }}
        run: |
          sed -e '/phpstan-baseline.neon/d' -e '/^includes:/d' phpstan.neon.dist > phpstan-apstats-tmp.neon
          php phpstan.phar analyse --level 9 --no-progress --memory-limit=2G -a dev/build/phpstan/bootstrap_action.php -c phpstan-apstats-tmp.neon htdocs/compta/sociales/payments.php htdocs/core/lib/functions.lib.php htdocs/compta/facture/class/facture.class.php htdocs/fourn/class/fournisseur.facture.class.php > phpstan-before.txt 2>&1 || true

      - name: Apply the fix (byte level, keeps UTF-8 and EOL of the sources)
        run: |
          python3 <<'PYEOF'
          import pathlib
          edits = [
            ("htdocs/core/lib/functions.lib.php",
             b"($object->country_id > 0 ? $object->country_id : '')",
             b"($object->country_id > 0 ? (string) $object->country_id : '')"),
            ("htdocs/core/lib/functions.lib.php",
             b"($object->thirdparty->country_id > 0 ? $object->thirdparty->country_id : '')",
             b"($object->thirdparty->country_id > 0 ? (string) $object->thirdparty->country_id : '')"),
            ("htdocs/compta/sociales/payments.php",
             b"if ($sortfield !== null",
             b"if (!empty($sortfield)"),
          ]
          for path, old, new in edits:
              p = pathlib.Path(path)
              data = p.read_bytes()
              n = data.count(old)
              if n != 1:
                  raise SystemExit("ERROR: pattern found %d times in %s (expected 1): %r" % (n, path, old))
              p.write_bytes(data.replace(old, new, 1))
              print("edited:", path)
          print("done")
          PYEOF
          git --no-pager diff --stat

      - name: Run PHPStan after the fix
        if: ${{ env.PHASE == 'analyse' }}
        run: |
          php phpstan.phar analyse --level 9 --no-progress --memory-limit=2G -a dev/build/phpstan/bootstrap_action.php -c phpstan-apstats-tmp.neon htdocs/compta/sociales/payments.php htdocs/core/lib/functions.lib.php htdocs/compta/facture/class/facture.class.php htdocs/fourn/class/fournisseur.facture.class.php > phpstan-after.txt 2>&1 || true

      - name: Publish PHPStan logs on the scratch branch
        if: ${{ env.PHASE == 'analyse' }}
        run: |
          git checkout tmp-cti-vibe-20261005
          git add phpstan-before.txt phpstan-after.txt
          git commit -m "tmp: phpstan results"
          git push origin tmp-cti-vibe-20261005

      - name: Finalize - push fix branch and remove scratch
        if: ${{ env.PHASE == 'finalize' }}
        run: |
          git add htdocs/core/lib/functions.lib.php htdocs/compta/sociales/payments.php
          git commit -m "QUAL: Fix 2 PHPStan warnings (country id substitution type, always true sortfield comparison)" -m "Generated by Vibe"
          git push origin work:fix-phpstan-substitution-sortfield
          git push origin --delete tmp-cti-vibe-20261005
