# build v3
name: TMP build clean phpstan CTI debt fix branch (temporary)

on:
  push:
    branches: [tmp-fix-cti-20261008]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tmp-fix-cti-20261008
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: phpstan:2.2.14
          extensions: calendar, json, imagick, gd, zip, mbstring, intl, opcache, imap, mysql, pgsql, sqlite3, ldap, xml

      - name: Build phpstan config like CTI (level 9, no baseline)
        run: |
          sed -e '/^includes:/d' -e '/phpstan-baseline\.neon/d' -e 's/level: 10/level: 9/' phpstan.neon.dist > phpstan_apstats.neon

      - name: Apply the fixes with python (byte-exact, no CR, UTF-8)
        run: |
          python3 - <<'PYEOF'
          import sys

          def patch(path, old, new):
              with open(path, 'rb') as f:
                  data = f.read()
              assert b'\r' not in data, 'source contains CR before patch: ' + path
              data.decode('utf-8')
              n = data.count(old)
              assert n == 1, 'expected exactly 1 occurrence in %s, got %d' % (path, n)
              before_lines = data.count(b'\n')
              data = data.replace(old, new)
              assert data.count(b'\n') == before_lines, 'line count changed in ' + path
              data.decode('utf-8')
              assert b'\r' not in data
              with open(path, 'wb') as f:
                  f.write(data)
              print('patched OK:', path)

          # Fix 1: clicktodial.php - remove useless ?? on non nullable string property, keep (string) cast for phan
          patch('htdocs/admin/clicktodial.php',
                b"\t$phonefortest = $mysoc->phone ?? '';",
                b"\t$phonefortest = (string) $mysoc->phone;")

          # Fix 2: dict.php - remove test always true after isset()
          patch('htdocs/admin/dict.php',
                b"(isset($obj->$value) && $obj->$value !== null && $obj->$value !== '')",
                b"(isset($obj->$value) && $obj->$value !== '')")
          PYEOF
          git diff --numstat
          test "$(git diff --name-only | wc -l)" -eq 2
          git diff --name-only | grep -q '^htdocs/admin/clicktodial.php$'
          git diff --name-only | grep -q '^htdocs/admin/dict.php$'

      - name: Run phpstan gate on the 4 debt files (must be 0 error)
        run: |
          phpstan analyse --no-progress --memory-limit 5G -a dev/build/phpstan/bootstrap_action.php -c phpstan_apstats.neon htdocs/admin/clicktodial.php htdocs/admin/dict.php htdocs/core/ajax/savekanbanfield.php htdocs/core/ajax/updateextrafield.php

      - name: Commit on new branch fix-phpstan-td-cti-20261008 and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b fix-phpstan-td-cti-20261008
          git add htdocs/admin/clicktodial.php htdocs/admin/dict.php
          git commit -F - <<'MSGEOF'
          QUAL: Fix PHPStan warnings on clicktodial.php and dict.php

          Remove usage of ?? on a non nullable property (Societe::$phone, used
          as a default phone number for the clicktodial test form) and remove
          a test that is always true after an isset() check, reported by the
          CTI PHPStan technical debt page.

          These are the remaining errors of the first 4 lines of the PHPStan
          technical debt list published on https://cti.dolibarr.org/ (the 2
          other ones about restrictedArea() were already fixed into
          develop with the addition of the $mode parameter).

          Generated by Vibe.
          MSGEOF
          git log -1 --format='commit %H%nparents %P'
          git push origin fix-phpstan-td-cti-20261008
