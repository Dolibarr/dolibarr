# amend v2
name: TMP amend phpstan CTI debt fix (temporary)

on:
  push:
    branches: [tmp-fix-cti-20261008]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tmp-fix-cti-20261008
  cancel-in-progress: true

jobs:
  amend:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix-phpstan-cti-debt-20261008
          fetch-depth: 1

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: phpstan:2.2.14
          extensions: calendar, json, imagick, gd, zip, mbstring, intl, opcache, imap, mysql, pgsql, sqlite3, ldap, xml

      - name: Build phpstan config like CTI (level 9, no baseline)
        run: |
          sed -e '/^includes:/d' -e '/phpstan-baseline\.neon/d' -e 's/level: 10/level: 9/' phpstan.neon.dist > phpstan_apstats.neon

      - name: Amend the fix with python (byte-exact, no CR, UTF-8)
        run: |
          python3 - <<'PYEOF'
          import sys

          def patch(path, old, new):
              with open(path, 'rb') as f:
                  data = f.read()
              assert b'\r' not in data, 'source contains CR before patch: ' + path
              data.decode('utf-8')
              n = data.count(old)
              assert n == 1, 'expected exactly 1 occurrence in %s, got %d' % (path, n)
              before_lines = data.count(b'\n')
              data = data.replace(old, new)
              assert data.count(b'\n') == before_lines, 'line count changed in ' + path
              data.decode('utf-8')
              assert b'\r' not in data
              with open(path, 'wb') as f:
                  f.write(data)
              print('patched OK:', path)

          # Add a (string) cast so phan also knows the value is a non nullable string
          patch('htdocs/admin/clicktodial.php',
                b"\t$phonefortest = $mysoc->phone;",
                b"\t$phonefortest = (string) $mysoc->phone;")
          PYEOF
          git diff --numstat
          test "$(git diff --name-only | wc -l)" -eq 1
          git diff --name-only | grep -q '^htdocs/admin/clicktodial.php$'

      - name: Run phpstan gate on the 2 fixed files (must be 0 error)
        run: |
          phpstan analyse --no-progress --memory-limit 5G -a dev/build/phpstan/bootstrap_action.php -c phpstan_apstats.neon htdocs/admin/clicktodial.php htdocs/admin/dict.php

      - name: Amend commit and force push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add htdocs/admin/clicktodial.php
          git commit --amend --no-edit
          git push --force origin fix-phpstan-cti-debt-20261008
