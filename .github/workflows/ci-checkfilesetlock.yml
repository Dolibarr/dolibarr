---
# This is a basic workflow to check the lock on major version (to lock some files on certified versions)
name: Check fileset lock

on:
  push:
    branches:
      - "24.0"
      - develop
  pull_request_target:
    branches:
      - "24.0"
      - develop

concurrency:
  group: check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Check that the user that pushes/merges into the current branch is a maintainer (github id
  # found on a "M:" line of the MAINTAINERS/MAINTENERS file, or "eldy" if the file does not exist).
  check-merger:
    if: github.event_name == 'push' && github.repository == 'Dolibarr/dolibarr'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: Check that the merger is a maintainer
        env:
          MERGER: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
        run: |
          MAINTFILE=""
          for f in MAINTAINERS MAINTENERS; do
            if [ -f "$f" ]; then MAINTFILE="$f"; break; fi
          done
          if [ -n "${MAINTFILE}" ]; then
            # Extract github ids from lines "M:	Name <email> / githubid"
            ALLOWED=$(grep -E '^M:' "${MAINTFILE}" | sed -n 's|.*/[[:space:]]*\(.*[^[:space:]]\)[[:space:]]*$|\1|p' | tr '[:upper:]' '[:lower:]' | sort -u)
          else
            ALLOWED="eldy"
          fi
          echo "Branch: ${BRANCH}"
          echo "Merger: ${MERGER}"
          echo "Maintainers file: ${MAINTFILE:-none}"
          echo "Allowed users:"
          echo "${ALLOWED}"
          if echo "${ALLOWED}" | grep -qxF "$(echo "${MERGER}" | tr '[:upper:]' '[:lower:]')"; then
            echo "OK, ${MERGER} is allowed to merge into ${BRANCH}."
          else
            echo "::error::User ${MERGER} is not declared as a maintainer (M: entry in ${MAINTFILE:-MAINTAINERS}) and is not allowed to merge into ${BRANCH}."
            exit 1
          fi
      - name: Add a warning comment on the merged PR
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          MERGER: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # Find the merged PR(s) associated to the pushed commit
          PRS=$(gh api "repos/${REPO}/commits/${SHA}/pulls" --jq ".[] | select(.merged_at != null and .base.ref == \"${BRANCH}\") | .number")
          if [ -z "${PRS}" ]; then
            echo "No merged PR found for commit ${SHA} (direct push ?)"
            exit 0
          fi
          for pr in ${PRS}; do
            echo "Add warning comment on PR #${pr}"
            gh pr comment "${pr}" --repo "${REPO}" --body "Warning: The PR was not merged by the allowed official merger for this repository and branch (merged by @${MERGER} into ${BRANCH})."
          done
  checkmajorversion:
    name: Check lock on fileset unalterable_files with generate_filelist_xml.php
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    # Referent Qualite/ Conformite (will be autoassigned as reviewer)
    env:
      REVIEWER: "eldy"


    # Do not run schedule on forks
    if: |
      github.repository == 'Dolibarr/dolibarr'
      || github.event.schedule == false
    steps:
      # 1) Generate a GitHub App token (via actions/create-github-app-token)
      - name: Generate GitHub App token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.PR18_APP_ID }}
          private-key: ${{ secrets.PR18_SECRET_KEY }}


      # 2) Checkout repository (useful if repo content is needed later)
      - name: Checkout repository
        uses: actions/checkout@v7

      # Debug information (useful for diagnostics)
      - name: Debug info
        run: |
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Ref: $GITHUB_REF"
          echo "Run id: $GITHUB_RUN_ID"
          echo "Reviewer configured: $REVIEWER"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          coverage: none # disable xdebug, pcov

      - name: Run generate_filelist_xml.php
        id: checklock
        continue-on-error: true
        run: |
          # shellcheck disable=2086
          dev/build/generate_filelist_xml.php checklock=auto unalterable_files


      # Assign reviewers one-by-one with fine-grained error handling
      #    - try each reviewer, track successes and failures
      #    - fail the step only if none could be added
      #    - succeed if at least one was added (but log failures)
      - name: Assign reviewers on PR (per-reviewer, tolerant errors)
        if: ${{ github.event_name == 'pull_request_target' && steps.checklock.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          REVIEWER: ${{ env.REVIEWER }}
        run: |
          echo "Lock check failed, assigning reviewer ${REVIEWER}"

          curl -s \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/pulls/${PR_NUMBER}/requested_reviewers" \
            -d "{\"reviewers\": [\"${REVIEWER}\"]}"

      - name: Fail workflow if lock check failed
        if: steps.checklock.outcome == 'failure'
        run: |
          echo "The list of unalterable files has been modified."
          echo "Review from the compliance maintainer is required."
          exit 1
