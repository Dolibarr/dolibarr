server {
    listen 80;
    listen [::]:80;
    
    server_name saas.sccit-erp.local *.saas.sccit-erp.local;
    
    # إعادة توجيه HTTP إلى HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    
    server_name saas.sccit-erp.local *.saas.sccit-erp.local;
    
    # شهادات SSL (يتم استبدالها بشهادات حقيقية في الإنتاج)
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    
    # تحسينات SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # الأمان
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    root /var/www/html/htdocs;
    index index.php index.html index.htm;
    
    # سجلات
    access_log /var/log/nginx/sccit_erp_saas_access.log;
    error_log /var/log/nginx/sccit_erp_saas_error.log;
    
    # حد أقصى لحجم الملف
    client_max_body_size 100M;
    
    # معالجة الطلبات
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    
    # معالجة ملفات PHP
    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        
        # حقن رؤوس إضافية
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    }
    
    # منع الوصول إلى الملفات الحساسة
    location ~ /\. {
        deny all;
    }
    
    location ~ \.env {
        deny all;
    }
    
    location ~ ^/vendor {
        deny all;
    }
    
    location ~ ^/saas/config {
        deny all;
    }
    
    location ~ ^/storage {
        deny all;
    }
    
    # تخزين مؤقت للملفات الثابتة
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|ttf|woff|woff2|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    # محرر الصور (سحب الصور المخزنة مؤقتاً)
    location ~ ^/image.php {
        fastcgi_pass php:9000;
        fastcgi_index image.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }
}
